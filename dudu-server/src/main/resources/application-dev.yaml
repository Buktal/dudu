spring:
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:mysql://127.0.0.1:${MYSQL_PORT:3306}/dudu?sslMode=REQUIRED&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: dudu
    password: ${MYSQL_PASSWORD}

dudu:
  auth:
    jwt-secret: ${DUDU_AUTH_JWT_SECRET:dudu-dev-only-signing-key-change-me}
