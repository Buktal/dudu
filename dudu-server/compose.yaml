# Local development only. Production deployment is configured separately.
name: mysql-local

services:
  mysql:
    image: mysql:8.4.11
    container_name: mysql-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: dudu
      MYSQL_USER: dudu
      MYSQL_PASSWORD: 123456
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_ROOT_HOST: "%"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP --host=127.0.0.1 --user=\"$$MYSQL_USER\" --database=\"$$MYSQL_DATABASE\" --execute='SELECT 1' --silent > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# 评审用户（集成测试连独立评审库用，授权仅 dudu_review_% 库）。
# MySQL 初始化仅在空数据目录首次启动生效，已有卷上缺失时用 root 执行一次：
#   CREATE USER IF NOT EXISTS 'dudu_review'@'%' IDENTIFIED BY 'dudu_review_local';
#   GRANT ALL PRIVILEGES ON `dudu_review_%`.* TO 'dudu_review'@'%'; FLUSH PRIVILEGES;
volumes:
  mysql-data:
    name: mysql-local-data
