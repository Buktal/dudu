<!-- PROTOTYPE · 2026-10-09. Eight user-selected themes with shared neutrals; no production changes. -->
<style>
  #dudu-palette-study { display: flex; flex-direction: column; gap: 24px; }
  #dudu-palette-study .study-section { display: flex; flex-direction: column; gap: 14px; }
  #dudu-palette-study .study-heading { margin: 0; }
  #dudu-palette-study .neutral-row { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; }
  #dudu-palette-study .neutral-roles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
  #dudu-palette-study .neutral-role { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  #dudu-palette-study .neutral-color { display: block; height: 26px; }
  #dudu-palette-study .palette-option { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  #dudu-palette-study .option-heading { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
  #dudu-palette-study .option-heading h3 { margin: 0; }
  #dudu-palette-study .preview-stage { padding: 8px; }
  #dudu-palette-study .accent-roles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  #dudu-palette-study .accent-role { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  #dudu-palette-study .accent-color { display: block; height: 32px; }
  /* The mockup has its own fixed product colors. Surrounding labels follow the host. */
  #dudu-palette-study .du-preview {
    color-scheme: light;
    min-width: 0;
    overflow: hidden;
    border: 1px solid var(--du-line);
    border-radius: 10px;
    background: var(--du-canvas);
    color: var(--du-ink);
    font-family: "Inter Variable", "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    font-size: 12px;
    line-height: 1.55;
    font-weight: 400;
  }
  #dudu-palette-study .du-preview * { box-sizing: border-box; }
  #dudu-palette-study .du-preview[data-scheme="dark"] { color-scheme: dark; }
  #dudu-palette-study .du-chrome {
    display: flex;
    height: 32px;
    gap: 8px;
    align-items: center;
    padding: 0 10px;
    border-bottom: 1px solid var(--du-line);
  }
  #dudu-palette-study .du-logo { font-size: 13px; font-weight: 600; letter-spacing: -.35px; }
  #dudu-palette-study .du-mode { margin-left: auto; color: var(--du-secondary); font-size: 11px; }
  #dudu-palette-study .du-active-mode { color: var(--du-ink); background: var(--du-selected); padding: 1px 9px; border-radius: 5px; }
  #dudu-palette-study .du-main { display: grid; grid-template-columns: 30% minmax(0, 1fr); min-height: 209px; }
  #dudu-palette-study .du-queue { min-width: 0; background: var(--du-paper); border-right: 1px solid var(--du-line); padding: 8px 5px; }
  #dudu-palette-study .du-queue-title { padding: 0 4px 6px; font-size: 11px; font-weight: 500; }
  #dudu-palette-study .du-person { display: flex; flex-direction: column; padding: 6px; margin-bottom: 4px; border-radius: 5px; min-width: 0; }
  #dudu-palette-study .du-person-current { background: var(--du-selected); }
  #dudu-palette-study .du-person-name { font-weight: 500; white-space: nowrap; }
  #dudu-palette-study .du-person-note { color: var(--du-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
  #dudu-palette-study .du-chat { display: flex; flex-direction: column; gap: 8px; padding: 8px; min-width: 0; }
  #dudu-palette-study .du-chat-heading { display: flex; align-items: center; gap: 6px; font-weight: 500; }
  #dudu-palette-study .du-channel { color: var(--du-secondary); font-size: 11px; font-weight: 400; }
  #dudu-palette-study .du-message { max-width: 94%; padding: 6px 8px; border-radius: 9px; overflow-wrap: anywhere; }
  #dudu-palette-study .du-incoming { align-self: flex-start; background: var(--du-paper); border: 1px solid var(--du-line); border-top-left-radius: 3px; }
  #dudu-palette-study .du-outgoing { align-self: flex-end; background: var(--du-soft); border-top-right-radius: 3px; }
  #dudu-palette-study .du-composer { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: auto; padding: 6px; background: var(--du-paper); border: 1px solid var(--du-line); border-radius: 7px; }
  #dudu-palette-study .du-placeholder { color: var(--du-secondary); font-size: 11px; }
  #dudu-palette-study .du-send { margin-left: auto; background: var(--du-strong); color: var(--du-on-strong); border-radius: 5px; padding: 3px 8px; font-weight: 500; font-size: 11px; }
  @media (max-width: 440px) {
    #dudu-palette-study .neutral-row { grid-template-columns: 1fr; gap: 6px; }
    #dudu-palette-study .neutral-roles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
</style>

<div id="dudu-palette-study" aria-label="DuDu 已选定的八套主题色">

  </template>

  <script type="application/json" id="palette-study-data">

        "dark": { "canvas": "#181C20", "paper": "#22282E", "muted": "#2B3239", "line": "#3A444D", "ink": "#CBD3D9", "secondary": "#A5B0B9", "on-strong": "#181C20" }

<script>
  (() => {
    const root = document.getElementById("dudu-palette-study");
    const data = JSON.parse(root.querySelector("#palette-study-data").textContent);
    const template = root.querySelector("#palette-option-template");
    const neutralRoles = [["canvas", "底色"], ["paper", "面板"], ["muted", "辅助灰"], ["line", "分隔线"], ["ink", "正文"], ["secondary", "次要文字"]];
    const accentRoles = [["soft", "消息背景"], ["selected", "选中背景"], ["strong", "按钮 / 标记"]];

    function colorRole(color, name, neutral = false) {
      const role = document.createElement("div");
      role.className = neutral ? "neutral-role" : "accent-role";
      const swatch = document.createElement("span");
      swatch.className = neutral ? "neutral-color" : "accent-color";
      swatch.style.background = color;
      swatch.setAttribute("aria-hidden", "true");
      const caption = document.createElement("span");
      caption.className = "text-small text-muted";
      caption.textContent = name;
      role.append(swatch, caption);
      return role;
    }

    for (const [scheme, label] of [["light", "浅色共用"], ["dark", "深色共用"]]) {
      const row = document.createElement("div");
      row.className = "neutral-row";
      const title = document.createElement("span");
      title.className = "text-small";
      title.textContent = label;
      const roles = document.createElement("div");
      roles.className = "neutral-roles";
      for (const [key, name] of neutralRoles) roles.append(colorRole(data.neutrals[scheme][key], name, true));
      row.append(title, roles);
      root.querySelector("#shared-neutrals").append(row);
    }
    root.querySelector("#shared-neutrals").className = "study-section";

    function renderPalette(palette) {
      const fragment = template.content.cloneNode(true);
      const section = fragment.querySelector("section");
      section.dataset.paletteId = palette.id;
      section.setAttribute("aria-label", palette.name);
      fragment.querySelector("[data-name]").textContent = palette.name;
      fragment.querySelector("[data-mood]").textContent = palette.mood;
      const preview = fragment.querySelector(".du-preview");
      preview.dataset.scheme = palette.scheme;
      preview.setAttribute("aria-label", `${palette.name}会话示例：选中林小满、客服回复气泡和发送按钮`);
      for (const [name, color] of Object.entries(data.neutrals[palette.scheme])) preview.style.setProperty(`--du-${name}`, color);
      for (const [key, name] of accentRoles) {
        preview.style.setProperty(`--du-${key}`, palette[key]);
        fragment.querySelector("[data-roles]").append(colorRole(palette[key], name));
      }
      return fragment;
    }

    for (const palette of data.fixed) root.querySelector("#neutral-palettes").append(renderPalette(palette));
    for (let index = 0; index < data.accents.length; index += 2) {
      const pair = document.createElement("div");
      pair.className = "viz-grid";
      for (const palette of data.accents.slice(index, index + 2)) pair.append(renderPalette(palette));
      root.querySelector("#accent-palettes").append(pair);
    }
  })();
</script>
