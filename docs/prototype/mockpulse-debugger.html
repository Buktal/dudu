<!doctype html>
<!--
  MockPulse — disposable interaction prototype.
  Design question: what is the clearest way to compose a platform event and diagnose its receipt?
  Three independently arranged debugging views: split, guided, stream. ?variant= selects one.
  Single offline HTML file. No imports, build, server, real HTTP or crypto.
  Explicitly saved scripts and execution plans use this browser's localStorage, with JSON export.
  Product assumptions and interface decisions remain open for review.
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>MockPulse · 交互原型</title>
  <style>
    :root {
      color-scheme: light;
      --canvas:#eeefed; --surface:#fff; --surface-subtle:#f8f9f8; --surface-hover:#f0f2f0;
      --text:#222922; --muted:#737b73; --faint:#90978f; --line:#e6e9e4; --line-strong:#d4dacf;
      --accent:#de613b; --accent-hover:#c94d29; --accent-soft:#fff0e8; --accent-text:#a74627;
      --good:#267251; --good-soft:#edf6ef; --bad:#b44646; --bad-soft:#fff0ee;
      --warn:#9b721a; --warn-soft:#fbf5e6; --code:#f6f8f5; --shadow:0 12px 50px #24321e0b;
      --sans:Inter,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
      --mono:"Cascadia Code","SFMono-Regular",Consolas,monospace;
    }
    [data-theme="dark"] {
      color-scheme:dark; --canvas:#171b18; --surface:#222823; --surface-subtle:#1d231f;
      --surface-hover:#2c342e; --text:#e8ede7; --muted:#a0aba0; --faint:#7b887d;
      --line:#354036; --line-strong:#49574a; --accent:#ec8a66; --accent-hover:#f0a080;
      --accent-soft:#3c2e24; --accent-text:#f3b395; --good:#8bcaa5; --good-soft:#253b2d;
      --bad:#f0a3a0; --bad-soft:#402c2c; --warn:#e1c17d; --warn-soft:#3b3526; --code:#1b211d;
    }
    * {box-sizing:border-box}
    body {margin:0; background:var(--canvas); color:var(--text); font:13px/1.6 var(--sans)}
    button,input,textarea,select {font:inherit}
    button {cursor:pointer}
    button,a,input,textarea,select,summary {outline-offset:3px}
    :focus-visible {outline:2px solid var(--accent)}
    button {color:inherit}
    button:disabled {opacity:.48; cursor:not-allowed}
    button svg {flex:none}
    a {color:var(--accent-text)}
    h1,h2,h3,p {margin:0}
    h1 {font-size:25px; letter-spacing:-.8px; font-weight:650; line-height:1.4}
    h2 {font-size:15px; font-weight:650}
    h3 {font-size:13px; font-weight:650}
    .icon {width:18px; height:18px; stroke:currentColor; stroke-width:1.7; fill:none; stroke-linecap:round; stroke-linejoin:round; vertical-align:middle}
    .icon.small {width:14px; height:14px}
    .muted {color:var(--muted)}
    .tiny {font-size:11px}
    .mono,code,pre {font-family:var(--mono); font-size:12px}
    .row {display:flex; align-items:center; gap:9px}
    .spread {justify-content:space-between}
    .stack {display:flex; flex-direction:column; gap:16px}
    .grow {flex:1; min-width:0}
    .truncate {overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
    .eyebrow {color:var(--faint); font-size:10px; letter-spacing:1.5px; font-weight:650; margin-bottom:7px}
    .btn {display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:8px 13px; border:1px solid var(--line-strong); border-radius:7px; background:var(--surface); white-space:nowrap; font-size:12px; font-weight:550; line-height:1.45}
    .btn:hover:not(:disabled) {background:var(--surface-hover); border-color:var(--muted)}
    .btn.primary {background:var(--accent); border-color:var(--accent); color:#fff}
    .btn.primary:hover:not(:disabled) {background:var(--accent-hover); border-color:var(--accent-hover)}
    .btn.ghost {border-color:transparent; background:transparent; color:var(--muted)}
    .btn.small {padding:5px 9px; font-size:11px}
    .btn.square {padding:7px; width:32px; height:32px}
    .btn.danger {color:var(--bad)}
    .badge {display:inline-flex; align-items:center; gap:5px; border-radius:5px; background:var(--surface-hover); color:var(--muted); padding:2px 7px; font-size:10px; font-weight:550; white-space:nowrap}
    .badge.good {color:var(--good); background:var(--good-soft)}
    .badge.bad {color:var(--bad); background:var(--bad-soft)}
    .badge.warn {color:var(--warn); background:var(--warn-soft)}
    .badge.accent {color:var(--accent-text); background:var(--accent-soft)}
    .dot {width:6px; height:6px; display:inline-block; border-radius:50%; background:currentColor; flex:none}
    .shell {display:grid; grid-template-columns:196px minmax(0,1fr); height:calc(100vh - 98px); min-height:690px; max-width:1680px; margin:18px auto 80px; border:1px solid var(--line-strong); border-radius:12px; overflow:hidden; background:var(--surface); box-shadow:var(--shadow)}
    @media(min-width:1740px){.shell{margin-left:auto;margin-right:auto}}
    @media(max-width:1739px){.shell{margin-left:18px;margin-right:18px}}
    .sidebar {background:var(--surface-subtle); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; padding:22px 13px 14px}
    .brand {display:flex; gap:9px; align-items:center; padding:0 9px 29px; font-weight:750; letter-spacing:-.65px; font-size:19px}
    .brand-mark {height:31px; width:31px; display:grid; place-items:center; background:var(--accent); color:#fff; border-radius:9px; box-shadow:inset 0 0 0 1px #ffffff26}
    .brand-mark svg {width:23px; height:23px; stroke-width:2}
    .nav-caption {font-size:10px; letter-spacing:1.1px; color:var(--faint); padding:0 11px 8px}
    .nav {display:flex; flex-direction:column; gap:4px}
    .nav-btn {display:flex; gap:10px; align-items:center; width:100%; border:0; background:transparent; color:var(--muted); border-radius:7px; padding:10px 11px; text-align:left; font-size:12px}
    .nav-btn:hover {background:var(--surface-hover); color:var(--text)}
    .nav-btn.active {background:var(--accent-soft); color:var(--accent-text); font-weight:650}
    .nav-btn .count {margin-left:auto; color:var(--faint); font:10px var(--mono)}
    .sidebar-section {border-top:1px solid var(--line); margin-top:23px; padding-top:20px}
    .platform-mark {display:inline-grid; place-items:center; width:25px; height:25px; border-radius:7px; font-weight:650; font-size:11px; background:#202823; color:#fff; flex:none}
    .platform-mark.wecom {background:#e8f1fe; color:#306dbb}
    .platform-mark.big {width:36px; height:36px; font-size:16px; border-radius:10px}
    .sidebar-bottom {margin-top:auto; padding-top:20px}
    .workspace-label {margin:13px 10px 0; display:flex; align-items:center; gap:6px; color:var(--faint); font-size:10px}
    .main {display:flex; flex-direction:column; min-width:0; min-height:0}
    .topbar {height:54px; flex:none; border-bottom:1px solid var(--line); padding:0 27px; display:flex; align-items:center; justify-content:space-between; gap:12px}
    .breadcrumb {display:flex; align-items:center; gap:11px; font-size:11px; color:var(--muted)}
    .breadcrumb strong {font-weight:500; color:var(--text)}
    .page {flex:1; overflow:auto; padding:25px 27px 28px; min-height:0; scroll-behavior:smooth}
    .page-header {display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:21px}
    .page-header p {margin-top:5px; color:var(--muted); font-size:12px}
    .statusbar {height:28px; border-top:1px solid var(--line); padding:0 18px; display:flex; align-items:center; justify-content:space-between; gap:10px; color:var(--faint); font-size:10px; background:var(--surface-subtle)}
    .targetbar {display:flex; align-items:center; gap:13px; padding:12px 14px; background:var(--surface-subtle); border:1px solid var(--line); border-radius:9px; margin-bottom:18px}
    .target-platform {min-width:140px; display:flex; align-items:center; gap:8px; border-right:1px solid var(--line); padding-right:13px}
    .target-platform select {border:0; padding:0 16px 0 0; background:transparent; color:var(--text); font-weight:600; max-width:118px; font-size:12px}
    .method {font:650 10px var(--mono); color:var(--good); background:var(--good-soft); border-radius:4px; padding:3px 5px}
    .target-url {border:0; background:transparent; padding:0; text-align:left; color:var(--text); min-width:0}
    .target-label {display:block; font:9px var(--sans); color:var(--faint); margin-bottom:2px; letter-spacing:.3px}
    .target-url code {font-size:11px}
    .event-picker {display:flex; align-items:center; gap:7px; margin-bottom:15px; flex-wrap:wrap}
    .event-option {border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:6px; padding:6px 11px; font-size:11px; display:flex; align-items:center; gap:6px}
    .event-option.active {background:var(--text); border-color:var(--text); color:var(--surface)}
    .event-option:hover:not(.active) {border-color:var(--muted)}
    .event-picker .event-hint {margin-right:5px; color:var(--faint); font-size:10px}
    .debug-grid {display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; align-items:stretch}
    .panel {border:1px solid var(--line); border-radius:9px; background:var(--surface); overflow:hidden; min-width:0}
    .panel-head {min-height:48px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 16px; border-bottom:1px solid var(--line)}
    .panel-head h2 {font-size:12px}
    .panel-body {padding:17px}
    .segmented {display:inline-flex; gap:2px; background:var(--surface-subtle); border:1px solid var(--line); padding:2px; border-radius:6px}
    .segmented button {border:0; border-radius:4px; background:transparent; color:var(--muted); padding:3px 10px; font-size:10px}
    .segmented button.active {background:var(--surface); color:var(--text); box-shadow:0 1px 3px #0000000e}
    .field {display:flex; flex-direction:column; gap:6px; margin-bottom:15px; min-width:0}
    .field:last-child {margin-bottom:0}
    .field label,.field-label {display:block; font-size:11px; font-weight:600}
    .field .help {font-size:10px; color:var(--faint); line-height:1.5}
    input,textarea,select {width:100%; color:var(--text); background:var(--surface); border:1px solid var(--line-strong); border-radius:6px; padding:8px 10px; min-width:0; font-size:12px}
    input::placeholder,textarea::placeholder {color:var(--faint)}
    input[readonly] {background:var(--surface-subtle); color:var(--muted)}
    textarea {resize:vertical; line-height:1.7; min-height:84px}
    textarea.code-input {font:11px/1.75 var(--mono); background:var(--code); min-height:224px; tab-size:2}
    .field-pair {display:grid; grid-template-columns:1fr 1fr; gap:13px}
    .event-name {display:flex; align-items:center; justify-content:space-between; border:1px solid var(--line); border-radius:6px; background:var(--surface-subtle); padding:8px 10px}
    .event-name code {font-size:11px}
    .expect-box {padding:13px; background:var(--surface-subtle); border:1px solid var(--line); border-radius:7px; margin-top:15px}
    .expect-box .field {margin:10px 0 0}
    .expect-box input,.expect-box select {font:11px var(--mono); padding:7px 8px}
    .expect-title {display:flex; justify-content:space-between; align-items:center; font-size:10px; font-weight:600}
    .expect-title span:last-child {color:var(--faint); font-weight:400}
    .compose-footer {padding:13px 16px; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:auto}
    .compose-panel {display:flex; flex-direction:column}
    .compose-panel .panel-body {flex:1}
    .signature-note {font-size:9px; color:var(--faint)}
    kbd {font:9px var(--mono); color:var(--faint); border:1px solid var(--line-strong); border-radius:3px; padding:1px 4px; white-space:nowrap}
    .btn.primary kbd {border-color:#ffffff40; color:#ffffffc0}
    .tabs {display:flex; gap:17px; border-bottom:1px solid var(--line); padding:0 16px}
    .tabs button {border:0; background:transparent; border-bottom:2px solid transparent; padding:10px 0 9px; font-size:11px; color:var(--muted)}
    .tabs button.active {color:var(--text); border-bottom-color:var(--accent); font-weight:600}
    .empty-result {min-height:292px; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:28px 24px}
    .empty-art {position:relative; width:170px; height:84px; display:flex; align-items:center; justify-content:center; gap:28px; margin-bottom:16px}
    .empty-art:before {content:""; width:100px; position:absolute; height:1px; background:var(--line-strong)}
    .empty-art .endpoint {position:relative; width:52px; height:52px; border:1px solid var(--line-strong); border-radius:13px; background:var(--surface); display:grid; place-items:center; box-shadow:0 4px 10px #20301507; transform:rotate(-7deg)}
    .empty-art .endpoint:last-child {transform:rotate(7deg); color:var(--accent)}
    .empty-art .endpoint .icon {width:24px; height:24px}
    .empty-result h3 {font-size:13px; margin-bottom:7px}
    .empty-result p {color:var(--muted); max-width:280px; font-size:11px}
    .empty-checks {display:flex; gap:12px; margin-top:23px; font-size:9px; color:var(--faint); flex-wrap:wrap; justify-content:center}
    .empty-checks span {display:flex; gap:4px; align-items:center}
    .result-banner {display:flex; gap:11px; align-items:flex-start; padding:14px; border:1px solid transparent; border-radius:7px; margin-bottom:16px; background:var(--good-soft); color:var(--good)}
    .result-banner.bad {background:var(--bad-soft); color:var(--bad)}
    .result-banner.warn {background:var(--warn-soft); color:var(--warn)}
    .result-banner h3 {font-size:13px; line-height:1.5}
    .result-banner p {font-size:10px; margin-top:3px; opacity:.85}
    .metrics {display:grid; grid-template-columns:1fr 1fr 1fr; border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:14px}
    .metric {border-right:1px solid var(--line); padding-left:15px}
    .metric:first-child {padding-left:0}
    .metric:last-child {border:0}
    .metric span {display:block; color:var(--faint); font-size:9px; margin-bottom:4px}
    .metric strong {font:500 17px var(--mono)}
    .assertion {display:flex; align-items:center; gap:8px; padding:7px 0; font-size:11px}
    .assertion .icon {width:14px; height:14px; color:var(--good)}
    .assertion.bad .icon {color:var(--bad)}
    .assertion .value {margin-left:auto; color:var(--muted); font:10px var(--mono)}
    .result-footnote {font-size:10px; color:var(--faint); margin-top:13px; border-top:1px solid var(--line); padding-top:11px}
    .code-view {margin:0; padding:14px; color:var(--text); background:var(--code); border:1px solid var(--line); border-radius:6px; font:11px/1.85 var(--mono); overflow:auto; max-height:380px; white-space:pre-wrap; word-break:break-word}
    .code-view .key {color:#857646}
    .code-view .string {color:var(--good)}
    .code-view .number {color:var(--accent-text)}
    .code-label {color:var(--faint); font-size:9px; letter-spacing:.7px; margin:13px 0 6px}
    .code-label:first-child {margin-top:0}
    .flow {display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 17px; background:var(--surface-subtle); border-top:1px solid var(--line); font-size:9px; color:var(--faint)}
    .flow span {display:flex; align-items:center; gap:5px; white-space:nowrap}
    .flow i {flex:1; height:1px; background:var(--line)}
    .flow .done {color:var(--good)}
    .flow .failed {color:var(--bad)}
    .flow .current {color:var(--accent)}
    .spinner {width:13px; height:13px; border:2px solid var(--line-strong); border-top-color:var(--accent); border-radius:50%; display:inline-block; animation:spin .8s linear infinite; flex:none}
    @keyframes spin {to{transform:rotate(360deg)}}
    .recent {margin-top:21px}
    .recent-head {display:flex; justify-content:space-between; align-items:center; margin-bottom:9px}
    .recent-head h2 {font-size:11px}
    .recent-row {display:flex; align-items:center; gap:13px; width:100%; border:0; border-bottom:1px solid var(--line); background:transparent; padding:9px 2px; text-align:left; font-size:10px}
    .recent-row:hover {background:var(--surface-subtle)}
    .recent-row .event {font:10px var(--mono); flex:1; min-width:0}
    .recent-row .stamp {font:10px var(--mono); color:var(--faint); width:61px}
    .recent-row .platform-name {width:62px; color:var(--muted)}
    .recent-row .duration {width:60px; text-align:right; font:10px var(--mono); color:var(--muted)}
    .guide-steps {display:flex; align-items:center; justify-content:center; gap:10px; margin:7px auto 22px; max-width:780px}
    .guide-steps button {display:flex; align-items:center; gap:8px; border:0; background:transparent; color:var(--faint); padding:7px 9px; font-size:11px}
    .guide-steps button b {display:grid; place-items:center; border:1px solid var(--line-strong); width:24px; height:24px; border-radius:50%; font:10px var(--mono)}
    .guide-steps button.active {color:var(--accent-text)}
    .guide-steps button.active b {background:var(--accent); color:#fff; border-color:var(--accent)}
    .guide-steps i {flex:1; height:1px; background:var(--line); max-width:55px}
    .guided {max-width:760px; margin:auto}
    .guided .panel-body {padding:22px 28px}
    .guided .empty-result {min-height:260px}
    .guide-intro {font-size:12px; color:var(--muted); margin-bottom:20px}
    .guide-actions {display:flex; justify-content:space-between; gap:12px; margin-top:18px}
    .platform-choices {display:grid; grid-template-columns:1fr 1fr; gap:13px; margin:18px 0}
    .platform-choice {display:flex; align-items:center; gap:12px; padding:19px; border:1px solid var(--line-strong); border-radius:9px; background:var(--surface); text-align:left}
    .platform-choice.active {border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
    .platform-choice span small {display:block; color:var(--muted); margin-top:3px}
    .stream-compose {display:grid; grid-template-columns:180px minmax(0,1fr) auto; gap:12px; padding:16px; border:1px solid var(--line); border-radius:9px; align-items:end; margin-bottom:17px; background:var(--surface-subtle)}
    .stream-compose .field {margin:0}
    .stream-compose input {height:37px}
    .stream-layout {display:grid; grid-template-columns:minmax(0,1.1fr) minmax(330px,.9fr); gap:16px; min-height:386px}
    .stream-row {display:grid; grid-template-columns:67px minmax(0,1fr) auto; gap:12px; padding:14px 16px; border:0; border-bottom:1px solid var(--line); background:transparent; width:100%; text-align:left; align-items:center}
    .stream-row:hover {background:var(--surface-subtle)}
    .stream-row.active {background:var(--accent-soft)}
    .stream-row small {display:block; color:var(--muted); font-size:10px; margin-top:3px}
    .split-layout {display:grid; grid-template-columns:250px minmax(0,1fr); gap:17px; align-items:start}
    .library-item {display:block; width:100%; border:0; border-bottom:1px solid var(--line); background:transparent; padding:16px; text-align:left}
    .library-item:hover {background:var(--surface-subtle)}
    .library-item.active {background:var(--accent-soft); box-shadow:inset 3px 0 var(--accent)}
    .library-item h3 {font-size:12px; margin:8px 0 4px}
    .library-item p {font-size:10px; color:var(--muted)}
    .script-description {padding:17px 18px; border-bottom:1px solid var(--line)}
    .script-description p {font-size:11px; color:var(--muted); margin-top:4px}
    .script-step {display:grid; grid-template-columns:28px minmax(0,1fr) auto; align-items:center; gap:12px; padding:15px 18px; border-bottom:1px solid var(--line)}
    .step-number {display:grid; place-items:center; width:26px; height:26px; border:1px solid var(--line-strong); border-radius:6px; color:var(--faint); font:10px var(--mono)}
    .step-number.good {color:var(--good); background:var(--good-soft); border-color:transparent}
    .step-number.bad {color:var(--bad); background:var(--bad-soft); border-color:transparent}
    .script-step h3 {font-size:12px}
    .script-step code {font-size:10px; color:var(--muted)}
    .script-step .step-summary {display:block; font-size:10px; color:var(--faint); margin-top:3px}
    .script-footer {padding:13px 17px; display:flex; align-items:center; justify-content:space-between}
    .lane-grid {display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px; margin-bottom:20px}
    .lane {border:1px solid var(--line); border-radius:8px; padding:13px 15px; background:var(--surface-subtle)}
    .lane-head {display:flex; justify-content:space-between; gap:9px; align-items:center; margin-bottom:10px}
    .lane-head h3 {font-size:11px}
    .lane-progress {display:flex; gap:5px}
    .lane-progress span {height:4px; flex:1; border-radius:3px; background:var(--line-strong)}
    .lane-progress span.good {background:var(--good)}
    .lane-progress span.bad {background:var(--bad)}
    .lane-progress span.current {background:var(--accent)}
    .lane p {color:var(--muted); font-size:10px; margin-top:8px}
    .toolbar {display:flex; gap:10px; align-items:center; margin-bottom:17px; flex-wrap:wrap}
    .toolbar select {width:auto; min-width:112px; padding:7px 9px; font-size:11px}
    .search {position:relative; flex:1; min-width:180px; max-width:310px}
    .search .icon {position:absolute; left:10px; top:10px; width:14px; height:14px; color:var(--faint)}
    .search input {padding-left:31px; font-size:11px}
    table {width:100%; border-collapse:collapse; text-align:left; font-size:11px}
    th {font-weight:500; color:var(--faint); font-size:10px; background:var(--surface-subtle); padding:11px 15px; border-bottom:1px solid var(--line)}
    td {padding:14px 15px; border-bottom:1px solid var(--line)}
    td .mono {font-size:10px}
    tr:last-child td {border-bottom:0}
    tbody tr:hover {background:var(--surface-subtle)}
    .table-wrap {overflow:auto}
    .table-event small {display:block; color:var(--faint); font-size:10px; margin-top:3px}

      .page-header>.row{flex-wrap:wrap;justify-content:flex-end}.page-header .btn{font-size:10px;padding:7px 8px}

      .proto-bar .design-button{font-size:0;gap:0}.proto-bar .design-button svg{width:16px;height:16px}
      .stream-compose{grid-template-columns:1fr auto}.stream-compose>.field:first-child{grid-column:1/-1}
      .guide-steps{gap:3px;flex-wrap:wrap}.guide-steps button{padding:5px;font-size:9px;gap:4px}.guide-steps i{display:none}
      .guided .panel-body{padding:18px}.settings-nav{flex-direction:row;flex-wrap:wrap}.lane-grid{grid-template-columns:1fr}
      .script-step{padding:12px;gap:8px}.script-step .btn.square{width:27px;height:27px;padding:5px}
    }
    @media(prefers-reduced-motion:reduce) {*{scroll-behavior:auto!important;transition:none!important}.spinner{animation:none}}
  </style>

<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page">
        <h1>MockPulse</h1>
        <p style="margin-top:12px">正在打开交互原型。如预览窗口没有继续加载，请使用 Edge 或 Chrome 直接打开此 HTML 文件。</p>

      </main>
      <footer class="statusbar" id="statusbar"></footer>
    </div>
  </div>
  <div class="proto-bar" id="proto-bar" aria-label="原型方案与演示状态"></div>
  <dialog id="modal" aria-labelledby="dialog-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
  'use strict';
  const $ = id => document.getElementById(id);

  const paths = {
    pulse:'<path d="M2 12h5l3-8 4 16 3-8h5"/>',
    terminal:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3m6 0h4"/>',
    layers:'<path d="m12 3 10 5-10 5L2 8l10-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/>',
    route:'<rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="15" y="15" width="6" height="6" rx="1.5"/><path d="M9 6h6a3 3 0 0 1 3 3v6M6 9v9h9"/>',
    history:'<path d="M3 12a9 9 0 1 0 3-6M3 3v5h5m4 0v5l3 2"/>',
    settings:'<path d="M4 7h16M4 17h16"/><circle cx="8" cy="7" r="3"/><circle cx="16" cy="17" r="3"/>',
    message:'<path d="M21 11a8 8 0 0 1-8 8H8l-5 3 1-6a8 8 0 0 1-1-5 8 8 0 0 1 8-8h2a8 8 0 0 1 8 8Z"/><path d="M8 10h8M8 14h5"/>',
    door:'<path d="M9 3h10v18H9m-6-9h11m-4-4 4 4-4 4"/>',
    link:'<path d="m10 13 4-4m-6 7-2 2a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0m2 1 2-2a4 4 0 0 1 6 6l-5 5a4 4 0 0 1-6 0" transform="translate(1 0)"/>',
    play:'<path d="m8 4 12 8-12 8V4Z"/>',
    stop:'<rect x="5" y="5" width="14" height="14" rx="2"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    check:'<path d="m5 12 4 4L19 6"/>',
    x:'<path d="m6 6 12 12M6 18 18 6"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',
    left:'<path d="m14 6-6 6 6 6"/>',
    right:'<path d="m10 6 6 6-6 6"/>',
    up:'<path d="m6 14 6-6 6 6"/>',
    down:'<path d="m6 10 6 6 6-6"/>',
    download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',
    upload:'<path d="M12 16V4m-5 5 5-5 5 5M4 16v5h16v-5"/>',
    save:'<path d="M5 3h12l4 4v14H3V3h2Zm2 0v6h9V3M7 21v-8h10v8"/>',
    edit:'<path d="m15 4 5 5M4 20l5-1L21 7a2 2 0 0 0-4-4L5 15l-1 5Z"/>',
    trash:'<path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/>',
    search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',
    help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4 2c-1 .5-1.5 1-1.5 2m0 3h.01"/>',
    server:'<rect x="3" y="3" width="18" height="8" rx="2"/><rect x="3" y="13" width="18" height="8" rx="2"/><path d="M7 7h.01M7 17h.01m4-10h6m-6 10h6"/>',
    image:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 6-6 4 4 3-3 5 5"/>',

  function icon(name,small) {return '<svg class="icon'+(small?' small':'')+'" viewBox="0 0 24 24" aria-hidden="true">'+(paths[name]||paths.terminal)+'</svg>';}
  function btn(label,action,glyph,style,attrs) {return '<button type="button" class="btn '+(style||'')+'" data-action="'+action+'" '+(attrs||'')+'>'+(glyph?icon(glyph):'')+label+'</button>';}
  function badge(status) {
    const types={passed:['good','符合期待'],failed:['bad','未符合期待'],timeout:['warn','回执超时'],running:['accent','执行中'],waiting:['','待执行'],cancelled:['','已停止'],skipped:['','已跳过']};

  }
  const PLATFORMS={
    douyin:{name:'抖音',short:'抖',type:'dop Webhooks',channel:'douyin-dop',url:'http://127.0.0.1:8080/webhooks/douyin',key:'demo_client_key',secret:'demo_client_secret'},
    wecom:{name:'企业微信',short:'企',type:'自建应用',channel:'wecom-app',url:'http://127.0.0.1:8080/webhooks/wecom',key:'ww_demo_corp',secret:'demo_callback_token',agent:'1000002',aes:'demo_encoding_aes_key'}
  };
  const EVENTS={
    douyin:[
      {id:'im_receive_msg',title:'收到文本私信',kind:'消息',icon:'message',key:'text',label:'消息内容',example:{conversation_short_id:'@demo_conversation',server_message_id:'@demo_message',conversation_type:1,message_type:'text',text:'你好，我想了解一下这款产品。',create_time:1789027200000}},
      {id:'im_enter_direct_msg',title:'进入私信会话',kind:'事件',icon:'door',key:'scene_type',label:'进入来源（5 = 消息页）',example:{conversation_short_id:'@demo_conversation',conversation_type:1,scene_type:5,create_time:1789027200000}},
      {id:'verify_webhook',title:'校验回调地址',kind:'事件',icon:'link',key:'challenge',label:'校验值 Challenge',example:{challenge:12345}}
    ],
    wecom:[
      {id:'text',title:'收到文本消息',kind:'消息',icon:'message',key:'Content',label:'消息内容',example:{MsgType:'text',Content:'你好，请帮我查询一下进度。'}},
      {id:'enter_agent',title:'进入应用会话',kind:'事件',icon:'door',key:'EventKey',label:'事件附加值',example:{MsgType:'event',Event:'enter_agent',EventKey:''}},
      {id:'image',title:'收到图片消息',kind:'消息',icon:'image',key:'MediaId',label:'图片素材 ID',example:{MsgType:'image',MediaId:'DEMO_MEDIA_ID',PicUrl:'https://example.invalid/demo.jpg'}}
    ]
  };
  const eventFor=(p,id)=>EVENTS[p].find(e=>e.id===id);
  function makeStep(p,id) {const e=eventFor(p,id)||EVENTS[p][0]; return {id:uid('step'),event:e.id,content:copy(e.example),sender:p==='douyin'?'demo_open_id':'demo_member',expect:{status:200,max_ms:5000}};}
  const seeds=[
    {id:'dy-a',platform:'douyin',name:'抖音 A · 私信接入',steps:[makeStep('douyin','verify_webhook'),makeStep('douyin','im_enter_direct_msg'),makeStep('douyin','im_receive_msg')]},
    {id:'wx-a',platform:'wecom',name:'企微 A · 应用消息',steps:[makeStep('wecom','enter_agent'),makeStep('wecom','text')]},
    {id:'dy-b',platform:'douyin',name:'抖音 B · 单条私信',steps:[makeStep('douyin','im_receive_msg')]}
  ];
  const STORAGE_KEY='mockpulse.prototype.debugger.v1';
  let storageNotice='';
  function validLibrary(data) {
    return data && Array.isArray(data.scripts) && data.scripts.length>0 && Array.isArray(data.plans) &&
      data.scripts.every(s=>typeof s.id==='string' && PLATFORMS[s.platform] && typeof s.name==='string' && Array.isArray(s.steps) &&
        s.steps.every(st=>eventFor(s.platform,st.event) && st.content && typeof st.content==='object' && !Array.isArray(st.content) && st.expect && Number(st.expect.max_ms)>0));
  }
  let saved;
  try {const raw=localStorage.getItem(STORAGE_KEY); if(raw){const parsed=JSON.parse(raw);if(validLibrary(parsed))saved=parsed;else storageNotice='已忽略不兼容的本地原型数据。';}} catch (_) {storageNotice='浏览器存储不可用；可用导出 JSON 保存剧本。';}
  const S={
    view:'debug',platform:'douyin',variant:'split',guide:2,editMode:'form',resultTab:'overview',scenario:'normal',
    drafts:{douyin:makeStep('douyin','im_receive_msg'),wecom:makeStep('wecom','text')},
    scripts:saved? saved.scripts:copy(seeds),plans:saved?saved.plans:[{id:'plan-a',name:'跨平台接入回归',mode:'parallel',scripts:['dy-a','wx-a']}],
    activeScript:saved?saved.scripts[0].id:'dy-a',scriptFilter:'all',plan:null,planDirty:false,
    history:[],result:null,running:false,phase:-1,execution:null,selectedRecord:null,
    settingsTab:'douyin',historyPlatform:'all',historyStatus:'all',historyQuery:'',editorError:'',theme:'light'

  S.plan=copy(S.plans[0]||{id:uid('plan'),name:'新的运行编排',mode:'parallel',scripts:[]});
  const variants={split:'01 · 并排调试',guided:'02 · 分步调试',stream:'03 · 事件流'};
  const routeNames={debug:'事件调试',scripts:'平台剧本',plans:'运行编排',history:'运行记录',settings:'连接设置'};
  try {const q=new URLSearchParams(location.search);const hash=new URLSearchParams(location.hash.slice(1));const v=hash.get('variant')||q.get('variant');const page=hash.get('page')||q.get('page');if(variants[v])S.variant=v;if(routeNames[page])S.view=page;} catch(_){}
  function routeURL() {
    const params='variant='+S.variant+'&page='+S.view;
    // file: documents have opaque origins in some hosts. A same-document hash needs no history API or reload.

  }

    catch(_) {storageNotice='浏览器存储不可用；请导出 JSON 保存。';toast(storageNotice);return false;}
  }
  function toast(message) {$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3200);}
  function mark(p,big) {return '<span class="platform-mark '+(p==='wecom'?'wecom ':'')+(big?'big':'')+'">'+PLATFORMS[p].short+'</span>';}
  function pageHeader(title,sub,actions,eyebrow) {return '<div class="page-header"><div><div class="eyebrow">'+(eyebrow||'MOCKPULSE / LOCAL WORKSPACE')+'</div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="row">'+(actions||'')+'</div></div>';}
  function targetbar() {
    return '<div class="targetbar"><div class="target-platform">'+mark(S.platform)+'<select aria-label="调试平台" data-change="platform">'+Object.keys(PLATFORMS).map(p=>'<option value="'+p+'" '+(p===S.platform?'selected':'')+'>'+PLATFORMS[p].name+'</option>').join('')+'</select></div><span class="method">POST</span><button class="target-url grow" data-action="connection"><span class="target-label">待测服务 · 点击修改</span><code>'+h(PLATFORMS[S.platform].url)+'</code></button><span class="badge">示例连接</span>'+btn('','connection','settings','square','aria-label="编辑当前平台连接"')+'</div>';

  function expectedFields(draft) {
    return '<div class="expect-box"><div class="expect-title"><span>期待的回执</span><span>独立判断是否符合期待</span></div><div class="field-pair"><div class="field"><label for="expect-status">HTTP 状态码</label><input id="expect-status" type="number" min="100" max="599" data-input="expect-status" value="'+h(draft.expect.status)+'"></div><div class="field"><label for="expect-time">最长响应时间 / ms</label><input id="expect-time" type="number" min="1" max="60000" data-input="expect-time" value="'+h(draft.expect.max_ms)+'"></div></div></div>';
  }
  function composeBody() {
    const d=S.drafts[S.platform], e=eventFor(S.platform,d.event);
    return (S.editorError?'<div class="form-error" role="alert">'+h(S.editorError)+'</div>':'')+

  const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  function makeRecord(p,step,scenario,source) {
    const status=scenario==='timeout'?null:scenario==='rejected'?401:200;
    const duration=scenario==='timeout'?5000:p==='douyin'?128:164;
    const checks=[{label:'HTTP 状态符合期待',ok:status===step.expect.status,value:String(status===null?'无应答':status)+' / '+step.expect.status},{label:'在指定时间内应答',ok:status!==null&&duration<=step.expect.max_ms,value:duration+' / '+step.expect.max_ms+' ms'}];
    let body=status===null?'':status===401?pretty({error:'invalid_signature',message:'演示：待测服务拒绝了签名'}):p==='wecom'?'success':step.event==='verify_webhook'?pretty({challenge:step.content.challenge}):'';
    if(step.event==='verify_webhook')checks.push({label:'回显 Challenge',ok:status===200,value:status===200?String(step.content.challenge):'未回显'});
    const kind=scenario==='timeout'?'timeout':checks.every(c=>c.ok)?'passed':'failed';
    return {id:uid('run'),time:new Date().toLocaleTimeString('zh-CN',{hour12:false}),platform:p,event:step.event,step:copy(step),request:requestFor(p,step),status,duration,body,checks,kind,source,
      title:kind==='passed'?'已收到应答，符合本次期待':scenario==='timeout'?'等待回执超时':scenario==='rejected'?'服务拒绝了这次签名':'收到应答，但不符合期待',
      reason:kind==='passed'?'请继续核对响应体；业务处理结果需要另外验证。':scenario==='timeout'?'演示到达 5 秒超时点，未收到 HTTP 应答。':scenario==='rejected'?'演示 HTTP 401。可检查两端的密钥和参与签名的原始正文。':'实际状态码或响应时间与设置的期待不同。'};
  }
  async function simulate(p,step,scenario,source,token,phaseCallback) {
    for(let phase=0;phase<4;phase++){if(token!==epoch)return null;phaseCallback(phase);await pause(scenario==='timeout'?350:230);}
    if(token!==epoch)return null;
    const record=makeRecord(p,step,scenario,source);S.history.unshift(record);return record;
  }
  async function sendSingle(p,step,source) {
    if(S.running)return;
    const token=++epoch, scenario=S.scenario;
    S.running=true;S.result=null;S.selectedRecord=null;S.resultTab='overview';S.execution=null;
    if(S.variant==='guided')S.guide=4;
    const record=await simulate(p,step,scenario,source||'单条调试',token,phase=>{S.phase=phase;refreshLive();});
    if(!record||token!==epoch)return;
    S.result=record;S.running=false;S.phase=4;refreshLive();
    toast(record.kind==='passed'?'演示完成：本次回执符合期待。':'演示完成：请查看回执中的失败原因。');
  }
  async function runScripts(ids,mode,name,origin) {
    if(S.running)return;
    const scripts=ids.map(id=>S.scripts.find(s=>s.id===id));
    if(!scripts.length||scripts.some(s=>!s||!s.steps.length)){toast('请为编排添加有步骤的有效剧本。');return;}
    const token=++epoch, scenario=S.scenario;
    S.running=true;
    S.execution={id:uid('execution'),name,mode,origin,status:'running',lanes:scripts.map(s=>({scriptId:s.id,name:s.name,platform:s.platform,steps:copy(s.steps),results:[],current:0,status:'waiting'}))};
    const ex=S.execution;
    async function laneRun(lane) {
      if(token!==epoch)return;
      lane.status='running';refreshLive();
      for(let i=0;i<lane.steps.length;i++){
        if(token!==epoch)return;
        lane.current=i;refreshLive();
        const record=await simulate(lane.platform,lane.steps[i],scenario,(origin==='plan'?name+' / ':'')+lane.name+' / 第 '+(i+1)+' 步',token,()=>{});
        if(!record||token!==epoch)return;
        lane.results.push(record);S.result=record;
        if(record.kind!=='passed'){lane.status=record.kind;refreshLive();return;}
      }
      lane.status='passed';refreshLive();
    }
    refreshLive();
    if(mode==='parallel')await Promise.all(ex.lanes.map(laneRun));else for(const lane of ex.lanes){if(token!==epoch)break;await laneRun(lane);}
    if(token!==epoch)return;
    ex.status=ex.lanes.every(l=>l.status==='passed')?'passed':'failed';S.running=false;refreshLive();
    toast('运行结束：'+ex.lanes.filter(l=>l.status==='passed').length+' / '+ex.lanes.length+' 个剧本符合期待。');
  }
  function stopExecution() {
    if(!S.running)return;
    epoch++;S.running=false;S.phase=-1;
    if(S.execution){S.execution.status='cancelled';S.execution.lanes.forEach(l=>{if(l.status==='running')l.status='cancelled';if(l.status==='waiting')l.status='skipped';});}
    render();toast('已停止执行，已完成的结果保留在运行记录中。');
  }

    'select-script':el=>{S.activeScript=el.dataset.id;render();},
    'save-script':()=>persist('剧本已保存，刷新后仍然可用。'),
    'export-script':()=>{const s=selectedScript();exportJSON(s.platform+'--'+s.name,scriptData(s));},
    'run-script':()=>{const s=selectedScript();void runScripts([s.id],'sequential',s.name,'script');},
    'run-step':el=>{const s=selectedScript(),st=copy(s.steps[Number(el.dataset.index)]);setPlatform(s.platform);S.drafts[s.platform]=copy(st);navigate('debug');void sendSingle(s.platform,st,s.name+' / 单步调试');},
    'step-up':el=>{const s=selectedScript(),i=Number(el.dataset.index);if(i<1)return;[s.steps[i-1],s.steps[i]]=[s.steps[i],s.steps[i-1]];persist('步骤顺序已保存。');render();},
    'remove-step':el=>{const s=selectedScript();s.steps.splice(Number(el.dataset.index),1);persist('步骤已移除，剧本已保存。');render();},
    'plan-mode':el=>{S.plan.mode=el.dataset.id;S.planDirty=true;render();},
    'plan-add':()=>{const el=$('add-plan-script');if(!el||!el.value)return;S.plan.scripts.push(el.value);S.planDirty=true;render();},
    'plan-up':el=>{const i=Number(el.dataset.index);if(i<1)return;[S.plan.scripts[i-1],S.plan.scripts[i]]=[S.plan.scripts[i],S.plan.scripts[i-1]];S.planDirty=true;render();},
    'plan-remove':el=>{S.plan.scripts.splice(Number(el.dataset.index),1);S.planDirty=true;render();},
    'new-plan':()=>{S.plan={id:uid('plan'),name:'新的运行编排',mode:'parallel',scripts:[]};S.planDirty=true;render();},
    'save-plan':()=>{if(!S.plan.name.trim()){toast('请填写编排名称。');return;}const i=S.plans.findIndex(p=>p.id===S.plan.id);if(i<0)S.plans.push(copy(S.plan));else S.plans[i]=copy(S.plan);if(persist('运行编排已保存。'))S.planDirty=false;render();},
    'run-plan':()=>void runScripts(S.plan.scripts,S.plan.mode,S.plan.name||'未命名编排','plan'),
    'export-history':()=>exportJSON('mockpulse-run-records',S.history),
    'settings-tab':el=>{S.settingsTab=el.dataset.id;render();},
    'clear-history':()=>{if(S.running){toast('请等待运行结束或先停止执行。');return;}S.history=[];S.result=null;S.execution=null;S.selectedRecord=null;render();toast('本次演示的运行记录已清空。');}
  };
  let dialogContext={};
  function formActions(label) {return '<div class="dialog-actions">'+btn('取消','close',null,'')+'<button type="submit" class="btn primary">'+icon('save')+label+'</button></div>';}
  actions['new-script']=()=>{
    dialogContext={};
    openModal('新建平台剧本','<form data-form="new-script"><div class="field"><label for="new-script-name">剧本名称</label><input id="new-script-name" name="name" required maxlength="70" placeholder="例如：抖音 C · 私信重试" autofocus></div><div class="field"><label for="new-script-platform">所属平台</label><select id="new-script-platform" name="platform">'+Object.keys(PLATFORMS).map(p=>'<option value="'+p+'" '+(p===(S.scriptFilter==='all'?S.platform:S.scriptFilter)?'selected':'')+'>'+PLATFORMS[p].name+'</option>').join('')+'</select><span class="help">平台确定后，剧本只允许添加该平台的事件和消息。</span></div>'+formActions('创建并保存')+'</form>');
  };
  actions['add-to-script']=()=>{
    const d=currentDraft();if(!d)return;
    dialogContext={platform:S.platform,step:d};
    const matching=S.scripts.filter(s=>s.platform===S.platform);
    openModal('加入'+PLATFORMS[S.platform].name+'剧本','<form data-form="add-to-script"><div class="inline-note">'+mark(S.platform)+'<div>'+h(eventFor(S.platform,d.event).title)+'<br>当前事件只能加入'+PLATFORMS[S.platform].name+'剧本。</div></div><div class="field"><label for="target-script">目标剧本</label><select id="target-script" name="script">'+matching.map(s=>'<option value="'+s.id+'">'+h(s.name)+' · '+s.steps.length+' 步</option>').join('')+'<option value="__new">＋ 创建新的'+PLATFORMS[S.platform].name+'剧本</option></select></div><div class="field"><label for="target-script-name">新剧本名称</label><input id="target-script-name" name="name" maxlength="70" placeholder="仅在选择创建新剧本时使用"></div><div class="code-label">本次事件内容</div>'+codeBlock(d.content)+formActions('加入并保存')+'</form>');
  };
  function stepModal(index) {
    const script=selectedScript(),isNew=index===undefined,step=isNew?makeStep(script.platform,EVENTS[script.platform][0].id):copy(script.steps[index]);
    dialogContext={scriptId:script.id,platform:script.platform,index:isNew?-1:index,step};
    openModal((isNew?'添加':'编辑')+PLATFORMS[script.platform].name+'步骤','<form data-form="step"><div class="row spread" style="margin-bottom:16px"><span class="row">'+mark(script.platform)+'<b>'+h(script.name)+'</b></span><span class="badge accent">平台已锁定</span></div><div class="field"><label for="step-event">事件或消息</label><select id="step-event" name="event" data-change="step-event">'+EVENTS[script.platform].map(ev=>'<option value="'+ev.id+'" '+(ev.id===step.event?'selected':'')+'>'+ev.title+' · '+ev.id+'</option>').join('')+'</select></div><div class="field"><label for="step-sender">模拟发送者</label><input id="step-sender" name="sender" value="'+h(step.sender)+'"></div><div class="field"><label for="step-content">事件内容 · JSON</label><textarea id="step-content" name="content" class="code-input" spellcheck="false" required>'+h(pretty(step.content))+'</textarea></div><div class="field-pair"><div class="field"><label for="step-status">期待 HTTP 状态码</label><input id="step-status" name="status" type="number" min="100" max="599" required value="'+step.expect.status+'"></div><div class="field"><label for="step-time">最长响应时间 / ms</label><input id="step-time" name="time" type="number" min="1" max="60000" required value="'+step.expect.max_ms+'"></div></div>'+formActions('保存步骤')+'</form>');
  }
  actions['add-step']=()=>stepModal();
  actions['edit-step']=el=>stepModal(Number(el.dataset.index));
  actions['rename-script']=()=>{
    const s=selectedScript();dialogContext={scriptId:s.id};
    openModal('重命名剧本','<form data-form="rename-script"><div class="field"><label for="rename-script-name">剧本名称</label><input id="rename-script-name" name="name" required maxlength="70" value="'+h(s.name)+'"></div>'+formActions('保存名称')+'</form>');
  };
  actions['import-script']=()=>{
    dialogContext={};
    openModal('导入平台剧本','<form data-form="import-script"><p class="muted" style="margin-bottom:16px">选择导出的 JSON 文件，或粘贴内容。导入时会检查每一步的平台归属。</p><div class="field"><label for="import-file">从文件读取</label><input id="import-file" type="file" accept=".json,application/json" data-change="import-file"></div><div class="field"><label for="import-json">剧本 JSON</label><textarea id="import-json" name="json" class="code-input" required placeholder="粘贴 MockPulse 原型导出的剧本 JSON"></textarea></div>'+formActions('检查并导入')+'</form>','wide');
  };
  function importScript(data) {
    if(!data||!PLATFORMS[data.platform])throw Error('剧本必须声明有效平台：douyin 或 wecom。');
    if(typeof data.name!=='string'||!data.name.trim())throw Error('剧本需要一个名称。');
    if(!Array.isArray(data.steps))throw Error('steps 必须是步骤数组。');
    const p=data.platform;
    const steps=data.steps.map((st,i)=>{
      if(!st||st.channel!==PLATFORMS[p].channel||!eventFor(p,st.event))throw Error('第 '+(i+1)+' 步不属于'+PLATFORMS[p].name+'，不能导入这个剧本。');
      const content=data.format==='mockpulse-prototype-v1'?st.content&&st.content.payload:st.content;
      const sender=data.format==='mockpulse-prototype-v1'?st.content&&st.content.sender:makeStep(p,st.event).sender;
      if(!content||typeof content!=='object'||Array.isArray(content))throw Error('第 '+(i+1)+' 步的内容需要是 JSON 对象。');
      const status=Number(st.expect&&st.expect.status),max=Number(st.expect&&st.expect.max_ms);
      if(!Number.isInteger(status)||status<100||status>599||!Number.isFinite(max)||max<1)throw Error('第 '+(i+1)+' 步的期待回执设置无效。');
      return {id:uid('step'),event:st.event,content:copy(content),sender:String(sender||''),expect:{status,max_ms:max}};
    });
    return {id:uid('script'),name:data.name.trim(),platform:p,steps};
  }
  document.addEventListener('submit',event=>{
    const form=event.target;if(!form.dataset.form)return;event.preventDefault();
    const data=new FormData(form);
    try {
      switch(form.dataset.form){
        case 'new-script':{
          const name=String(data.get('name')||'').trim(),platform=data.get('platform');if(!name||!PLATFORMS[platform])throw Error('请填写名称并选择平台。');
          const script={id:uid('script'),platform,name,steps:[]};S.scripts.push(script);S.activeScript=script.id;S.scriptFilter=platform;
          persist('新剧本已保存，可以开始添加本平台步骤。');$('modal').close();navigate('scripts');break;
        }
        case 'add-to-script':{
          const ctx=dialogContext;let script;
          if(data.get('script')==='__new'){
            const name=String(data.get('name')||'').trim();if(!name)throw Error('请填写新剧本名称。');
            script={id:uid('script'),platform:ctx.platform,name,steps:[]};S.scripts.push(script);
          }else script=S.scripts.find(s=>s.id===data.get('script'));
          if(!script||script.platform!==ctx.platform)throw Error('事件只能加入同平台剧本。');
          const step=copy(ctx.step);step.id=uid('step');delete step.rawText;
          script.steps.push(step);S.activeScript=script.id;S.scriptFilter=ctx.platform;
          persist('事件已加入'+script.name+'并保存。');$('modal').close();navigate('scripts');break;
        }
        case 'step':{
          const ctx=dialogContext,script=S.scripts.find(s=>s.id===ctx.scriptId),eventId=data.get('event');if(!script||!eventFor(script.platform,eventId))throw Error('该事件不属于当前剧本的平台。');
          let content;try{content=JSON.parse(data.get('content'));}catch(_){throw Error('事件内容不是有效 JSON。');}
          if(!content||typeof content!=='object'||Array.isArray(content))throw Error('事件内容需要是 JSON 对象。');
          const status=Number(data.get('status')),max=Number(data.get('time'));if(!Number.isInteger(status)||status<100||status>599||max<1||!Number.isFinite(max))throw Error('请检查期待状态码和响应时间。');
          const step={id:ctx.index<0?uid('step'):ctx.step.id,event:eventId,content,sender:String(data.get('sender')||''),expect:{status,max_ms:max}};
          if(ctx.index<0)script.steps.push(step);else script.steps[ctx.index]=step;
          persist('步骤和剧本已保存。');$('modal').close();render();break;
        }
        case 'rename-script':{
          const script=S.scripts.find(s=>s.id===dialogContext.scriptId),name=String(data.get('name')||'').trim();if(!name)throw Error('名称不能为空。');
          script.name=name;persist('剧本名称已保存。');$('modal').close();render();break;
        }
        case 'import-script':{
          let parsed;try{parsed=JSON.parse(data.get('json'));}catch(_){throw Error('无法读取 JSON，请检查文件内容。');}
          const script=importScript(parsed);S.scripts.push(script);S.activeScript=script.id;S.scriptFilter=script.platform;
          persist('剧本已导入，平台归属检查通过。');$('modal').close();navigate('scripts');break;
        }
        case 'connection':{
          const config=PLATFORMS[S.settingsTab],url=new URL(String(data.get('url')));if(!['http:','https:'].includes(url.protocol))throw Error('回调地址需要使用 http 或 https。');
          config.url=url.href;config.key=String(data.get('key'));config.secret=String(data.get('secret')||'');
          if(S.settingsTab==='wecom'){config.agent=String(data.get('agent'));config.aes=String(data.get('aes'));}
          setPlatform(S.settingsTab);navigate('debug');toast('本次演示已应用连接配置。');break;
        }
      }
    }catch(error){if($('modal').open)formError(error.message);else toast(error.message);}
  });
  document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(el&&!el.disabled&&actions[el.dataset.action])actions[el.dataset.action](el);});
  document.addEventListener('input',event=>{
    const el=event.target,d=S.drafts[S.platform],ev=eventFor(S.platform,d.event);
    switch(el.dataset.input){
      case 'message':d.content[ev.key]=typeof ev.example[ev.key]==='number'?Number(el.value):el.value;delete d.rawText;break;
      case 'sender':d.sender=el.value;break;
      case 'content-json':d.rawText=el.value;break;
      case 'expect-status':d.expect.status=Number(el.value);break;
      case 'expect-time':d.expect.max_ms=Number(el.value);break;
      case 'plan-name':S.plan.name=el.value;S.planDirty=true;break;
      case 'history-query':S.historyQuery=el.value;if($('history-table'))$('history-table').innerHTML=historyTable();break;
    }
  });
  document.addEventListener('change',event=>{
    const el=event.target;
    switch(el.dataset.change){
      case 'platform':setPlatform(el.value);render();break;
      case 'stream-event':newEvent(el.value);break;
      case 'scenario':S.scenario=el.value;toast('后续运行将演示：'+el.options[el.selectedIndex].text);break;
      case 'plan-select':{const p=S.plans.find(p=>p.id===el.value);if(p){S.plan=copy(p);S.planDirty=false;render();}break;}
      case 'history-platform':S.historyPlatform=el.value;render();break;
      case 'history-status':S.historyStatus=el.value;render();break;
      case 'theme':S.theme=el.value;document.documentElement.dataset.theme=el.value;break;
      case 'step-event':{const ev=eventFor(dialogContext.platform,el.value);if(ev)$('step-content').value=pretty(ev.example);break;}
      case 'import-file':{const file=el.files&&el.files[0];if(file)file.text().then(text=>{if($('import-json'))$('import-json').value=text;}).catch(()=>formError('无法读取所选文件。'));break;}
    }
  });
  document.addEventListener('keydown',event=>{
    if($('modal').open)return;
    if((event.ctrlKey||event.metaKey)&&event.key==='Enter'&&S.view==='debug'){event.preventDefault();actions.send();return;}
    if(event.target.closest('input,textarea,select,[contenteditable]'))return;
    if(event.key==='ArrowLeft'){event.preventDefault();setVariant(-1);}
    if(event.key==='ArrowRight'){event.preventDefault();setVariant(1);}
  });
  render();
  </script>
</body>
</html>
