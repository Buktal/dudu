<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>MockPulse · 事件流原型</title>
  <!-- Chosen scheme 3. One offline HTML file. No real requests or remote assets. -->
  <style>
:root{
  color-scheme:light;
  --paper:#fff;--canvas:#f4f6f8;--input:#f0f3f7;--hover:#f6f8fa;
  --ink:#1e2935;--muted:#687786;--faint:#8793a0;
  --accent:#2d5b9a;--accent-hover:#23497e;--accent-soft:#eaf0f8;
  --good:#33735f;--bad:#af4848;--warn:#8d682f;
  --good-soft:#eff6f2;--bad-soft:#fbf0f0;--shadow:0 12px 40px #1e293519;
  --sans:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",sans-serif;
  --display:Bahnschrift,"Segoe UI","Microsoft YaHei UI",sans-serif;
  --mono:"Cascadia Mono",Consolas,monospace;
}
[data-theme="dark"]{
  color-scheme:dark;
  --paper:#20262d;--canvas:#191f26;--input:#2b333d;--hover:#272f38;
  --ink:#e3e8ee;--muted:#a1adbb;--faint:#8593a3;
  --accent:#96b9ed;--accent-hover:#b2cdf4;--accent-soft:#2b3b52;
  --good:#8ac1aa;--bad:#e69e9e;--warn:#d4b77c;
  --good-soft:#263a32;--bad-soft:#3b2b2f;--shadow:0 12px 40px #0004;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;min-width:340px}
body{font-family:var(--sans);font-size:14px;line-height:1.5;background:var(--paper);color:var(--ink);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button,summary,select{cursor:pointer}
button{border:0;background:none}
button:disabled{cursor:default;opacity:.4}
input,select,textarea{border:0;border-radius:5px;background:var(--input);padding:9px 11px;min-width:0;max-width:100%}
input,textarea{width:100%}
input[type="number"]{font-variant-numeric:tabular-nums}
input[readonly],textarea[readonly]{color:var(--muted);background:var(--hover)}
textarea{resize:vertical;line-height:1.6}
input::placeholder,textarea::placeholder{color:var(--faint);opacity:1}
input[type="file"]{background:transparent;padding:7px 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline-offset:1px}
h1,h2,h3,p{margin:0}
h1{font-size:20px;font-weight:650;letter-spacing:-.3px}
h2{font-size:15px;font-weight:600}
h3{font-size:14px;font-weight:600}
a{color:var(--accent);text-underline-offset:3px}
svg{display:block;width:18px;height:18px;flex-shrink:0}
.icon{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.small{width:15px;height:15px}
code,pre,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
code{font-size:12px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.spread{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:8px 13px;border-radius:5px;font-size:13px;font-weight:500;white-space:nowrap;flex-shrink:0}
.btn:hover:not(:disabled){background:var(--input)}
.btn.primary{background:var(--accent);color:var(--paper)}
.btn.primary:hover:not(:disabled){background:var(--accent-hover)}
.btn.soft{background:var(--input)}
.btn.soft:hover:not(:disabled){background:var(--accent-soft)}
.btn.small{min-height:32px;padding:6px 10px;font-size:12px}
.btn.square{width:32px;height:32px;min-height:32px;padding:7px}
.btn.ghost{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:400;white-space:nowrap;color:var(--muted)}
.badge.good{color:var(--good)}.badge.bad{color:var(--bad)}.badge.warn{color:var(--warn)}.badge.accent{color:var(--accent)}
.dot,.dirty-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.dirty-dot{color:var(--accent);margin-left:7px;vertical-align:middle}
.spinner{width:10px;height:10px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.app-shell{display:grid;grid-template-columns:184px minmax(0,1fr);height:100vh;height:100dvh}
.sidebar{display:flex;flex-direction:column;padding:30px 14px 16px;background:var(--canvas);min-height:0}

.brand-mark{color:var(--accent)}

.nav{display:flex;flex-direction:column;gap:5px;margin-top:36px}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border-radius:6px;color:var(--muted);font-size:13px;text-align:left;white-space:nowrap}
.nav-btn:hover{color:var(--ink);background:var(--input)}
.nav-btn.active{background:var(--accent-soft);color:var(--accent);font-weight:600}

.sidebar-bottom{margin-top:auto;padding-top:24px}
.prototype-launch{font-size:12px;gap:8px;padding:10px 8px}

.workspace{display:flex;flex-direction:column;min-width:0;min-height:0}

.page-header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px;flex-shrink:0;min-height:38px}
.page-heading{display:flex;align-items:center;gap:20px;min-width:0}

.platform-mark.wecom{color:var(--accent)}
.platform-mark.big{width:36px;height:36px;font-size:15px}
.collection-layout{display:grid;grid-template-columns:236px minmax(0,1fr);gap:38px;flex:1;min-height:0}
.panel{min-width:0}
.collection-panel{display:flex;flex-direction:column;min-height:0}

.search svg{color:var(--faint);width:16px;height:16px}

.collection-filters{display:flex;gap:8px}
.collection-filters select{flex:1;min-width:0;width:50%;font-size:12px;padding:7px 5px;background:transparent}
.collection-tools>select{font-size:12px;background:transparent;padding:7px 5px;align-self:flex-start;max-width:100%}
.collection-content{display:flex;flex-direction:column;flex:1;min-height:0}
.collection-items{flex:1;min-height:0;overflow:auto;padding:2px}

.collection-item p{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.collection-item:hover{background:var(--hover)}

.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;padding:14px 4px 0;flex-shrink:0;font-variant-numeric:tabular-nums}
.pager .row{gap:4px}

.empty-list h3{font-weight:500}
.empty-list p{margin:7px 0 14px;font-size:13px}
#event-editor,#script-detail{min-height:0;min-width:0}
.editor-shell,.script-editor{display:flex;flex-direction:column;height:100%;min-height:0}
.editor-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:22px;margin:0 0 14px;flex-shrink:0}
.editor-name{display:block;background:transparent;padding:0 2px 4px;margin-left:-2px;border-radius:3px;font-size:18px;font-weight:600;line-height:1.5;letter-spacing:-.2px}
.editor-name:hover{background:var(--hover)}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:12px;margin-top:3px}
.meta code{overflow-wrap:anywhere}
.editor-actions{gap:7px;padding-top:2px}
.editor-context{display:flex;align-items:center;gap:10px;color:var(--muted);margin-bottom:18px;min-height:30px;flex-shrink:0}
.editor-context code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.editor-context .btn{margin-left:auto}
.method{font:600 11px var(--mono);letter-spacing:.3px;color:var(--faint)}
.tabs{display:flex;gap:26px}
.tabs button{position:relative;padding:9px 0 11px;font-size:13px;color:var(--muted)}
.tabs button:hover{color:var(--ink)}
.tabs button.active{color:var(--accent);font-weight:600}
.tabs button.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}
.editor-nav{flex-shrink:0}
.editor-tools{display:flex;align-items:center;gap:12px;margin:20px 0 18px;flex-shrink:0}

.param-group-title{font-size:13px;font-weight:600;margin:0 0 8px;padding:0}
.param-row{display:grid;grid-template-columns:minmax(140px,.82fr) minmax(0,1.5fr);gap:24px;align-items:start;padding:8px 0}
.param-label{padding-top:5px;min-width:0}
.param-label .row{gap:5px}
.param-label label{font-size:13px}
.param-key{display:block;color:var(--faint);font:12px/1.5 var(--mono);overflow-wrap:anywhere;margin-top:2px}
.param-value{min-width:0}
.param-value input,.param-value select,.param-value textarea{width:100%;font-size:13px}
.param-value input{min-height:37px}
.help-button{width:22px;height:22px;min-height:22px;padding:4px;opacity:0;color:var(--muted)}
.help-button svg{width:14px;height:14px}
.param-row:hover .help-button,.param-row:focus-within .help-button{opacity:1}
.array-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 2px}
.array-heading>div{display:flex;gap:10px;align-items:center}
.array-heading b{font-size:13px;font-weight:600}
.array-item{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:5px}
.array-item .btn{opacity:0}
.array-item:hover .btn,.array-item:focus-within .btn{opacity:1}
.raw-editor{height:calc(100% - 18px);min-height:300px;resize:none;font:13px/1.75 var(--mono);padding:18px;margin-top:18px}
.editor-nav+.parameter-scroll{margin-top:8px}
.panel-body{padding:22px 0}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;min-width:0}
.field label,.field-label{font-size:13px;font-weight:500}
.field-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.help{color:var(--muted);font-size:12px;line-height:1.6}
.field-help-panel{flex-shrink:0;margin:10px 0 0;padding:12px 14px;border-radius:5px;background:var(--canvas);max-height:140px;overflow:auto}
.field-help-content{display:flex;align-items:flex-start;gap:14px}
.field-help-copy{flex:1;min-width:0}

.field-help-copy p{font-size:13px;line-height:1.6;margin-top:4px;color:var(--muted)}
.field-type{font-size:12px;color:var(--muted);margin-left:10px}
.receipt-strip{display:flex;align-items:center;flex-wrap:wrap;gap:0 20px;padding-top:12px;flex-shrink:0}
.receipt-summary{display:flex;flex:1;align-items:center;justify-content:space-between;gap:12px;min-height:32px}
.compact-log{font-size:12px;color:var(--muted)}
.compact-log summary{padding:7px 0;white-space:nowrap}
.compact-log summary span{margin-left:6px;font-variant-numeric:tabular-nums}
.compact-log[open]{flex-basis:100%}
.compact-log-body{max-height:140px;overflow:auto;margin-top:6px}
.recent-row{display:flex;align-items:center;gap:16px;min-height:36px;padding:7px 8px;width:100%;font-size:12px;border-radius:4px;text-align:left}
.recent-row:hover{background:var(--hover)}
.recent-row .stamp{font:12px var(--mono);color:var(--muted)}
.recent-row .event{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.action-menu{position:relative;flex-shrink:0}
.action-menu summary{display:flex;align-items:center;justify-content:center;list-style:none;width:34px;height:36px;border-radius:5px;color:var(--muted)}
.action-menu summary::-webkit-details-marker{display:none}
.action-menu summary:hover,.action-menu[open] summary{background:var(--input)}
.action-menu-body{position:absolute;right:0;top:calc(100% + 6px);min-width:172px;padding:6px;background:var(--paper);box-shadow:var(--shadow);border-radius:7px;z-index:15}
.action-menu-body .btn{justify-content:flex-start;width:100%;font-weight:400}
.script-editor .script-title{font-size:18px;font-weight:600;overflow-wrap:anywhere}
.script-editor>.panel-head{margin-bottom:20px;align-items:flex-start}

.step-summary{display:block;font-size:12px;color:var(--faint);margin-top:6px}
.step-actions,.step-secondary{display:flex;align-items:center;gap:1px}

.script-step:hover .step-secondary,.script-step:focus-within .step-secondary{opacity:1}
.saved-event-picker{margin-top:24px;flex-shrink:0}
.picker-caption{display:flex;align-items:center;gap:16px;justify-content:space-between;margin-bottom:12px}

#step-choice{flex:1;min-width:0;font-size:13px}
.settings-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:24px;flex-shrink:0}
.execution-summary{margin-bottom:24px}
.recent-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}
.recent-head h2{font-size:14px;font-weight:500}
.lane-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;max-height:220px;overflow:auto}
.lane{padding:14px;background:var(--canvas);border-radius:5px;min-width:0}

.picker-card{display:flex;flex-direction:column;min-height:0}

.candidate-items{flex:1;min-height:0;overflow:auto;padding:2px}

.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px}

dialog.wide{width:760px}
dialog.sheet{width:760px}
.dialog-header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:22px 26px 0}
.dialog-header h2{font-size:17px;font-weight:600}
.dialog-body{padding:22px 26px 26px}
.dialog-body .field:last-child{margin-bottom:0}
.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:28px}
.dialog-body details{margin-top:20px}
.dialog-body summary{font-size:13px;color:var(--muted);padding:5px 0}
.dialog-body details .code-view{margin-top:12px}
.platform-picker-list{max-height:360px;overflow:auto;margin-top:18px;padding:2px}
.platform-picker-item{display:flex;align-items:center;gap:10px;width:100%;padding:12px 10px;border-radius:5px;text-align:left}
.platform-picker-item:hover{background:var(--hover)}
.platform-picker-item.active{background:var(--accent-soft)}
.platform-picker-item b{display:block;font-size:13px;font-weight:500}
.platform-picker-item small{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.platform-picker-item .counts{font-size:12px;color:var(--muted)}
.prototype-note{font-size:13px;color:var(--muted);line-height:1.7;margin:0 0 24px}
.prototype-setting{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}
.prototype-setting h3{font-size:13px;font-weight:500}
.prototype-setting p{font-size:12px;color:var(--muted);margin-top:5px}
.prototype-setting select{font-size:13px;max-width:190px}
.prototype-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.design-point{margin-bottom:24px}
.design-point h3{font-size:14px}
.design-point p,.design-summary p{margin-top:7px;font-size:13px;color:var(--muted);line-height:1.8}
.result-banner{padding:16px;background:var(--good-soft);border-radius:5px;color:var(--good)}
.result-banner.bad,.result-banner.warn{background:var(--bad-soft);color:var(--bad)}
.result-banner h3{font-size:14px}
.result-banner p{margin-top:6px;font-size:13px}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin:28px 0}
.metric span{display:block;font-size:12px;color:var(--muted)}
.metric strong{display:block;font-size:23px;font-weight:500;margin-top:5px;font-variant-numeric:tabular-nums}
.assertion{display:flex;align-items:center;gap:10px;margin:15px 0;font-size:13px}
.assertion svg{width:16px;height:16px;color:var(--good)}
.assertion.bad svg{color:var(--bad)}
.assertion .value{margin-left:auto;color:var(--muted);font-size:12px}
.result-footnote{font-size:12px;color:var(--muted);margin:24px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:min(620px,calc(100vw - 36px));padding:12px 18px;border-radius:6px;background:var(--ink);color:var(--paper);font-size:13px;box-shadow:var(--shadow);z-index:100;pointer-events:none;opacity:0}
.toast.show{opacity:1}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#9da8b53d;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

  const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  function xmlText(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));}
  function xmlFields(value){return Object.entries(value).map(([key,v])=>{
    const tag=/^[A-Za-z_][\w:.-]*$/.test(key)?key:'Field',attr=tag===key?'':' name="'+xmlText(key)+'"';
    return '  <'+tag+attr+'>'+xmlText(typeof v==='object'?JSON.stringify(v):v)+'</'+tag+'>';
  }).join('\n');}
  function requestFor(event){
    const p=catalog[event.platform],def=template(event.platform,event.event),payload=copy(event.payload);
    if(def.wire.format==='wecom-xml'){
      const url=new URL(p.url);url.searchParams.set('msg_signature','DEMO_SIGNATURE');url.searchParams.set('timestamp',String(payload.CreateTime||1789027200));url.searchParams.set('nonce','demo');
      return {method:'POST',url:url.href,headers:{'Content-Type':'text/xml',...copy(event.headers)},body:'<xml>\n  <ToUserName>'+xmlText(payload.ToUserName)+'</ToUserName>\n  <Encrypt><![CDATA[DEMO_ENCRYPTED_BODY]]></Encrypt>\n  <AgentID>'+xmlText(payload.AgentID)+'</AgentID>\n</xml>',decoded:payload,plaintext:'<xml>\n'+xmlFields(payload)+'\n</xml>'};
    }
    for(const path of def.wire.stringifyPaths||[]){const value=getAt(payload,path);if(value!==undefined)setAt(payload,path,JSON.stringify(value));}
    const headers={'Content-Type':'application/json',...(event.platform==='douyin'?{'X-Douyin-Signature':'DEMO_SIGNATURE','Msg-Id':'DEMO_MSG_ID'}:{}),...copy(event.headers)};
    return {method:'POST',url:p.url,headers,body:pretty(payload),...(def.wire.stringifyPaths?.length?{decoded:copy(event.payload)}:{})};
  }
  function requestMarkup(request){return '<div class="code-label">目标</div>'+codeBlock(request.method+' '+request.url)+'<div class="code-label">请求头</div>'+codeBlock(request.headers)+'<div class="code-label">发送正文 · 签名和加密为演示值</div>'+codeBlock(request.body)+(request.decoded?'<div class="code-label">对应的完整明文参数</div>'+codeBlock(request.decoded):'')+(request.plaintext?'<details style="margin-top:12px"><summary class="tiny muted">查看明文 XML</summary>'+codeBlock(request.plaintext)+'</details>':'');}
  function requestPreview(event){try{return requestMarkup(requestFor(event));}catch(error){return '<div class="form-error">'+h(error.message)+'</div>';}}
  function makeRecord(event,scenario,source,request){
    const status=scenario==='timeout'?null:scenario==='rejected'?401:200,duration=scenario==='timeout'?5000:event.platform==='wecom'?164:128;
    const checks=[{label:'HTTP 状态符合期待',ok:status===event.expect.status,value:(status===null?'无应答':status)+' / '+event.expect.status},{label:'在指定时间内应答',ok:status!==null&&duration<=event.expect.max_ms,value:duration+' / '+event.expect.max_ms+' ms'}];
    const challenge=getAt(event.payload,['content','challenge']);
    if(event.event==='verify_webhook')checks.push({label:'回显 Challenge',ok:status===200,value:status===200?String(challenge):'未回显'});
    const kind=scenario==='timeout'?'timeout':checks.every(c=>c.ok)?'passed':'failed';
    const body=status===null?'':status===401?pretty({error:'invalid_signature',message:'演示：待测服务拒绝了签名'}):event.platform==='wecom'?'success':event.event==='verify_webhook'?pretty({challenge}):'';
    return {id:uid('run'),time:new Date().toLocaleTimeString('zh-CN',{hour12:false}),platform:event.platform,event:event.event,name:event.name,revision:event.revision,draft:!!event.dirty||!event.id,snapshot:copy(event),request:copy(request),status,duration,body,checks,kind,source,
      title:kind==='passed'?'已收到应答，符合本次期待':scenario==='timeout'?'等待回执超时':scenario==='rejected'?'服务拒绝了这次签名':'收到应答，但不符合期待',
      reason:kind==='passed'?'本次 HTTP 回执检查通过。业务处理结果可继续在你的服务中核对。':scenario==='timeout'?'演示到达 5 秒等待上限，未收到 HTTP 应答。':scenario==='rejected'?'演示 HTTP 401。请核对实际状态与本次设置的期待。':'实际状态码或响应时间与设置的期待不同。'};
  }
  async function simulate(event,scenario,source,token,phaseCallback,request){
    for(let phase=0;phase<4;phase++){if(token!==epoch)return null;phaseCallback(phase);await pause(scenario==='timeout'?350:230);}
    if(token!==epoch)return null;
    const record=makeRecord(event,scenario,source,request);S.history.unshift(record);return record;
  }

  async function sendSingle(value,source='单条调试',origin='debug'){
    if(S.running)return;
    let event,request;try{event=validatePreset(copy(value));request=requestFor(event);}catch(error){toast(error.message);return;}
    const token=++epoch,scenario=S.scenario;
    S.running=true;S.result=null;S.execution=null;S.singleOrigin=origin;S.stopped=false;S.phase=0;refreshLive();
    const record=await simulate(event,scenario,source,token,phase=>{S.phase=phase;refreshLive();},request);
    if(!record||token!==epoch)return;
    S.result=record;S.running=false;S.phase=4;refreshLive();toast(record.kind==='passed'?'演示完成：回执符合期待。':'演示完成：可以查看回执详情。');
  }
  async function runScripts(ids,mode,name,origin){
    if(S.running)return;
    let lanes;try{
      if(!['parallel','sequential'].includes(mode))throw Error('请选择串行或并发。');
      if(!ids.length)throw Error('请先添加一个有步骤的剧本。');
      lanes=ids.map(id=>{const script=S.scripts.find(s=>s.id===id);if(!script||!script.steps.length)throw Error('编排中的剧本需要至少一个已保存事件。');
        const steps=resolvedSteps(script).map(e=>{validatePreset(e);return {...e,requestSnapshot:requestFor(e)};});
        return {scriptId:script.id,name:script.name,platform:script.platform,steps,results:[],current:0,status:'waiting'};
      });
    }catch(error){toast(error.message);return;}
    const token=++epoch,scenario=S.scenario;
    S.running=true;S.stopped=false;S.result=null;S.singleOrigin=null;
    const ex={id:uid('execution'),name,mode,origin,status:'running',lanes};S.execution=ex;
    async function runLane(lane){
      if(token!==epoch)return;lane.status='running';refreshLive();
      for(let i=0;i<lane.steps.length;i++){
        if(token!==epoch)return;lane.current=i;refreshLive();
        const step=copy(lane.steps[i]),request=step.requestSnapshot;delete step.requestSnapshot;
        const record=await simulate(step,scenario,(origin==='plan'?name+' / ':'')+lane.name+' / 第 '+(i+1)+' 步',token,()=>{},request);
        if(!record||token!==epoch)return;lane.results.push(record);S.result=record;
        if(record.kind!=='passed'){lane.status=record.kind;refreshLive();return;}
      }
      lane.status='passed';refreshLive();
    }
    refreshLive();
    if(mode==='parallel')await Promise.all(ex.lanes.map(runLane));else for(const lane of ex.lanes){if(token!==epoch)break;await runLane(lane);}
    if(token!==epoch)return;
    ex.status=ex.lanes.every(l=>l.status==='passed')?'passed':'failed';S.running=false;refreshLive();toast('运行结束：'+ex.lanes.filter(l=>l.status==='passed').length+' / '+ex.lanes.length+' 个剧本符合期待。');
  }
  function stopExecution(){
    if(!S.running)return;++epoch;S.running=false;S.stopped=true;

  function importedLibrary(raw){
    if(raw?.demo&&!S.capacity)throw Error('这是容量演示的数据。请先在“原型选项”中开启容量演示，再导入此文件。');
    let data;
    if(raw?.format==='mockpulse-library-v2')data={events:copy(raw.events),scripts:copy(raw.scripts),plans:copy(raw.plans)};
    else if(raw?.format==='mockpulse-script-v2')data={events:copy(raw.events),scripts:[copy(raw.script)],plans:[]};
    else if(raw?.format==='mockpulse-event-v2')data={events:[copy(raw.event)],scripts:[],plans:[]};
    else if(raw?.format==='mockpulse-prototype-v1'||raw&&Array.isArray(raw.steps)&&raw.platform){
      if(!catalog[raw.platform]||typeof raw.name!=='string'||!raw.name.trim())throw Error('旧版剧本需要有效的平台与名称。');
      const events=raw.steps.map((step,i)=>{
        if(step.channel!==catalog[raw.platform].channel||!template(raw.platform,step.event))throw Error('第 '+(i+1)+' 步不属于'+catalog[raw.platform].name+'，不能混入该剧本。');

    }else throw Error('不支持的文件格式。请选择 MockPulse 导出的事件、剧本或事件库 JSON。');
    validateLibrary(data);

    'run-plan':()=>runScripts(S.plan.scripts,S.plan.mode,S.plan.name||'未命名编排','plan'),
    record:el=>recordModal(el.dataset.id),
    'load-record':el=>{const record=S.history.find(r=>r.id===el.dataset.id);if(!record)return;rememberEditor();S.editor={...copy(record.snapshot),id:null,name:record.name+' · 回执快照',revision:1,dirty:true};S.platform=record.platform;S.result=null;S.editorError='';S.fieldSearch='';S.fieldGroup='all';S.fieldHelpPath=null;rememberEditor();closeModal();navigate('debug');toast('已载入当时的完整参数，保存后成为一个新事件。');},
    'export-event':()=>{try{const e=editorValue();exportJSON(e.name,eventData(e));}catch(error){S.editorError=error.message;renderEditor();}},
    'export-script':()=>{const script=selectedScript();if(script)exportJSON(script.name,scriptData(script));},
    'export-library':()=>exportJSON('mockpulse-event-library',libraryData()),
    'export-history':()=>exportJSON('mockpulse-run-records',{format:'mockpulse-history-v2',records:S.history})
  };
  function templateOptions(p){return catalog[p].events.map(e=>'<option value="'+h(e.id)+'">'+h(e.title)+' · '+h(e.id)+'</option>').join('');}
  function platformOptions(selected){return Object.values(catalog).map(p=>'<option value="'+h(p.id)+'" '+(p.id===selected?'selected':'')+'>'+h(p.name)+'</option>').join('');}
  actions['new-event']=()=>{
    dialogContext={};openModal('新建事件','<form data-form="new-event"><div class="field"><label for="new-event-platform">平台</label><select id="new-event-platform" name="platform" data-change="new-event-platform">'+platformOptions(S.platform)+'</select></div><div class="field"><label for="new-event-template">事件或消息</label><select id="new-event-template" name="event">'+templateOptions(S.platform)+'</select></div><div class="field"><label for="new-event-name">名称</label><input id="new-event-name" name="name" placeholder="例如：新客户咨询" maxlength="100"></div>'+formActions('创建')+'</form>');
  };
  actions['save-event-as']=()=>{
    try{editorValue();}catch(error){S.editorError=error.message;renderEditor();return;}
    openModal('另存为新的事件','<form data-form="save-event-as"><div class="field"><label for="copy-event-name">新事件名称</label><input id="copy-event-name" name="name" required maxlength="100" value="'+h(S.editor.name+' · 副本')+'" autofocus><span class="help">创建一个独立配置，已有剧本继续引用原事件。</span></div>'+formActions('另存为')+'</form>');
  };
  actions['new-script']=()=>{
    dialogContext={};openModal('新建平台剧本','<form data-form="new-script"><div class="field"><label for="new-script-platform">所属平台</label><select id="new-script-platform" name="platform">'+platformOptions(S.platform)+'</select><span class="help">创建后平台固定，只能引用这个平台的已保存事件。</span></div><div class="field"><label for="new-script-name">剧本名称</label><input id="new-script-name" name="name" required maxlength="100" placeholder="例如：抖音 C · 售后咨询" autofocus></div>'+formActions('创建并保存')+'</form>');
  };
  actions['rename-script']=()=>{
    const script=selectedScript();if(!script)return;dialogContext={scriptId:script.id};openModal('重命名剧本','<form data-form="rename-script"><div class="field"><label for="rename-script-name">剧本名称</label><input id="rename-script-name" name="name" required maxlength="100" value="'+h(script.name)+'" autofocus></div>'+formActions('保存名称')+'</form>');
  };
  actions.import=()=>{
    dialogContext={};openModal('导入事件、剧本或事件库','<form data-form="import"><p class="muted tiny" style="margin-bottom:16px">导入为新的条目，保留文件内的引用关系。可以选择 JSON 文件，也可以粘贴内容。</p><div class="field"><label for="import-file">从文件读取</label><input id="import-file" type="file" accept=".json,application/json" data-change="import-file"></div><div class="field"><label for="import-json">JSON 内容</label><textarea id="import-json" name="json" class="code-input" required placeholder="支持新版事件库、事件、剧本，以及上版导出的剧本。"></textarea></div>'+formActions('检查并导入')+'</form>','wide');
  };
  document.addEventListener('submit',event=>{
    const form=event.target;if(!form.dataset.form)return;event.preventDefault();const data=new FormData(form);
    try{
      switch(form.dataset.form){
        case 'new-event':{
          const p=String(data.get('platform')),type=String(data.get('event'));if(!template(p,type))throw Error('请选择所属平台的事件。');
          startDraft(p,type);const name=String(data.get('name')||'').trim();if(name)S.editor.name=name;markDirty();closeModal();navigate('debug');break;
        }
        case 'save-event-as':{const name=String(data.get('name')||'').trim();if(!name)throw Error('请填写事件名称。');const saved=saveEvent(true,name);if(!saved)throw Error(S.editorError);closeModal();break;}
        case 'new-script':{
          const p=String(data.get('platform')),name=String(data.get('name')||'').trim();if(!catalog[p]||!name)throw Error('请选择平台并填写剧本名称。');
          const script={id:uid('script'),platform:p,name,steps:[]};S.scripts.push(script);selectPlatform(p);S.activeScript=script.id;S.scriptScope='platform';S.scriptQuery='';S.stepQuery='';S.stepChoice='';persist('剧本已创建，可从下拉列表添加事件。');closeModal();navigate('scripts');break;
        }
        case 'rename-script':{const name=String(data.get('name')||'').trim(),script=S.scripts.find(s=>s.id===dialogContext.scriptId);if(!name||!script)throw Error('请填写剧本名称。');script.name=name;persist('剧本名称已保存。');closeModal();render();break;}
        case 'import':{
          let raw;try{raw=JSON.parse(String(data.get('json')));}catch(_){throw Error('无法读取 JSON，请检查文件内容。');}
          const imported=importedLibrary(raw);S.events.push(...imported.events);S.scripts.push(...imported.scripts);S.plans.push(...imported.plans);
          persist('已导入 '+imported.events.length+' 个事件、'+imported.scripts.length+' 个剧本、'+imported.plans.length+' 个编排。');closeModal();
          if(imported.plans.length){S.plan=copy(imported.plans[0]);S.planDirty=false;navigate('plans');}
          else if(imported.scripts.length){selectPlatform(imported.scripts[0].platform);S.activeScript=imported.scripts[0].id;S.scriptQuery='';navigate('scripts');}
          else if(imported.events.length){loadEvent(imported.events[0].id);S.eventQuery='';S.eventType='all';navigate('debug');}else render();break;
        }
        case 'connection':{const url=new URL(String(data.get('url')));if(!['http:','https:'].includes(url.protocol))throw Error('回调地址需要使用 http 或 https。');const p=S.connectionPlatform;catalog[p].url=url.href;delete S.connectionDrafts[p];render();toast('已应用'+catalog[p].name+'在本次会话的连接地址。');break;}
      }
    }catch(error){if($('modal').open)formError(error.message);else toast(error.message);}
  });
  document.addEventListener('click',event=>{
    const el=event.target.closest('[data-action]');
    document.querySelectorAll('.action-menu[open]').forEach(menu=>{
      if(!menu.contains(event.target))menu.open=false;
      else if(el){menu.open=false;menu.querySelector('summary').focus({preventScroll:true});}
    });
    if(!el||el.disabled||!actions[el.dataset.action])return;
    try{Promise.resolve(actions[el.dataset.action](el)).catch(error=>toast(error.message));}catch(error){toast(error.message);}
  });
  document.addEventListener('focusin',event=>{
    const el=event.target;
    if(el.dataset.input==='parameter'&&S.view==='debug'&&S.editorTab==='fields')showFieldHelp(JSON.parse(el.dataset.path));
  });
  document.addEventListener('input',event=>{
    const el=event.target,d=S.editor;
    switch(el.dataset.input){
      case 'parameter':{
        if(el.readOnly||el.disabled)return;const path=JSON.parse(el.dataset.path);if(!safePath(path))return;let value=el.value;
        if(el.dataset.type==='integer'||el.dataset.type==='number')value=el.value===''?null:Number(el.value);
        else if(el.dataset.type==='boolean')value=el.value==='true';
        else if(['null','object','array'].includes(el.dataset.type)){try{value=JSON.parse(el.value);}catch(_){value=el.value;}}
        setAt(d.payload,path,value);delete d.raw;markDirty();break;
      }
      case 'connection-url':S.connectionDrafts[S.connectionPlatform]=el.value;break;
      case 'event-name':d.name=el.value;markDirty();break;
      case 'event-tags':d.tags=el.value.split(/[,，]/).map(v=>v.trim()).filter(Boolean);markDirty();break;
      case 'full-json':d.raw=el.value;delete d.headersRaw;markDirty();break;
      case 'event-headers':d.headersRaw=el.value;delete d.raw;markDirty();break;
      case 'expect-status':d.expect.status=el.value===''?null:Number(el.value);delete d.raw;markDirty();break;
      case 'expect-time':d.expect.max_ms=el.value===''?null:Number(el.value);delete d.raw;markDirty();break;
      case 'field-search':S.fieldSearch=el.value;hideFieldHelp();if($('parameter-region'))$('parameter-region').innerHTML=parameterContents();break;
      case 'platform-query':if($('platform-picker-list'))$('platform-picker-list').innerHTML=platformPickerRows(el.value);break;
      case 'event-query':S.eventQuery=el.value;S.eventPage=1;renderEventList();break;
      case 'script-query':S.scriptQuery=el.value;S.scriptPage=1;refreshCollection('scriptPage');break;
      case 'step-query':S.stepQuery=el.value;if($('step-picker-options'))$('step-picker-options').innerHTML=stepPicker();break;
      case 'plan-name':S.plan.name=el.value;dirtyPlan();break;
      case 'plan-query':S.planQuery=el.value;S.planPickerPage=1;refreshCollection('planPickerPage');break;
      case 'history-query':S.historyQuery=el.value;S.historyPage=1;refreshCollection('historyPage');break;
    }
  });
  document.addEventListener('change',event=>{
    const el=event.target;
    if(el.dataset.input==='parameter'&&el.tagName==='SELECT')el.dispatchEvent(new Event('input',{bubbles:true}));
    switch(el.dataset.change){
      case 'event-scope':S.eventScope=el.value;S.eventPage=1;renderEventList();break;
      case 'event-type':S.eventType=el.value;S.eventPage=1;renderEventList();break;
      case 'field-group':S.fieldGroup=el.value;hideFieldHelp();if($('parameter-region'))$('parameter-region').innerHTML=parameterContents();break;
      case 'script-scope':S.scriptScope=el.value;S.scriptPage=1;refreshCollection('scriptPage');break;
      case 'step-choice':S.stepChoice=el.value;break;
      case 'plan-platform':S.planPlatform=el.value;S.planPickerPage=1;refreshCollection('planPickerPage');break;
      case 'history-platform':S.historyPlatform=el.value;S.historyPage=1;refreshCollection('historyPage');break;
      case 'history-status':S.historyStatus=el.value;S.historyPage=1;refreshCollection('historyPage');break;
      case 'scenario':if(!S.running)S.scenario=el.value;break;
      case 'theme':S.theme=el.value;document.documentElement.dataset.theme=el.value;break;
      case 'new-event-platform':if(catalog[el.value]&&$('new-event-template'))$('new-event-template').innerHTML=templateOptions(el.value);break;
      case 'plan-select':{const plan=S.plans.find(p=>p.id===el.value);if(plan){if(S.planDirty)S.planBuffers[S.plan.id]=copy(S.plan);S.plan=copy(S.planBuffers[plan.id]||plan);S.planDirty=!!S.planBuffers[plan.id];render();}break;}
      case 'import-file':{const file=el.files?.[0],input=$('import-json');if(file)file.text().then(value=>{if(input?.isConnected)input.value=value;}).catch(()=>formError('无法读取所选文件。'));break;}
    }
  });
  document.addEventListener('keydown',event=>{
    if($('modal').open)return;
    if(event.key==='Escape'){
      const menu=document.querySelector('.action-menu[open]');
      if(menu){event.preventDefault();menu.open=false;menu.querySelector('summary').focus();return;}
      if(S.fieldHelpPath){event.preventDefault();hideFieldHelp(true);return;}
    }
    if((event.ctrlKey||event.metaKey)&&event.key==='Enter'&&S.view==='debug'){event.preventDefault();actions.send();}
    if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){
      if(['debug','scripts','plans'].includes(S.view)){event.preventDefault();actions[S.view==='debug'?'save-event':S.view==='scripts'?'save-script':'save-plan']();}
    }
  });
  $('modal').addEventListener('close',()=>{S.modal=null;});
  window.addEventListener('hashchange',()=>{const p=new URLSearchParams(location.hash.slice(1)).get('page');if(routeNames[p]&&p!==S.view){S.view=p;render();}});

  render();
  </script>
</body>
</html>
