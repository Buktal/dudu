*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--body);font-size:13px;color:var(--ink);background:var(--paper)}
body{overflow:hidden}
button,input,textarea,select{font:inherit}
button,a,input,textarea,select,summary{-webkit-tap-highlight-color:transparent}
button{cursor:pointer;color:inherit}
button:disabled{opacity:.42;cursor:not-allowed}
button{border:0}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--paint-315de84a);outline-offset:2px}
input,textarea,select{border:1px solid var(--line);background:var(--white);border-radius:6px;color:var(--ink);padding:9px 11px;min-width:0;max-width:100%}
input:hover,textarea:hover,select:hover{border-color:var(--paint-b8c6dc)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--paint-315de821);border-color:var(--blue)}
textarea{resize:vertical;line-height:1.65}
input[type=number]{font-family:var(--mono)}
input[type=checkbox]{accent-color:var(--blue)}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4,p{margin:0}
svg{width:18px;height:18px;flex:none;vertical-align:middle}
code,.mono{font-family:var(--mono)}
small{font-size:11px}
.muted{color:var(--muted)}
.blue{color:var(--blue)}
.green{color:var(--green)}
.red{color:var(--red)}
.nowrap{white-space:nowrap}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:9px}
.column{display:flex;flex-direction:column;gap:5px}
.gap16{gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.hidden{display:none!important}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:7px;min-height:35px;padding:7px 12px;background:var(--paint-ffffff);border:1px solid var(--line);border-radius:7px;font-size:12px;white-space:nowrap;font-weight:550;transition:background .12s,border-color .12s}
.btn:hover{background:var(--paper);border-color:var(--paint-b8c6dc)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--paint-ffffff)}
.btn.primary:hover{background:var(--paint-244ecc)}
.btn.soft{border-color:transparent;background:var(--soft-blue);color:var(--blue)}
.btn.quiet{background:transparent;border-color:transparent}
.btn.quiet:hover{background:var(--paint-eaf0f8)}
.btn.danger{color:var(--red);border-color:var(--paint-edccd1)}
.btn.small{min-height:29px;padding:4px 9px;font-size:11px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;background:transparent;border-radius:6px;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--soft-blue);color:var(--blue)}
.icon-btn svg{width:16px;height:16px}
.text-btn{background:transparent;padding:3px 0;color:var(--blue);font-size:12px;display:inline-flex;align-items:center;gap:5px}

  function stepCard(step,i){const snapshot=step.snapshot,current=db.events.find(e=>e.id===step.eventId),outdated=current&&current.revision>snapshot.revision;return`<div class="step-wrap"><div class="step-order"><span class="order-dot">${String(i+1).padStart(2,'0')}</span></div><div class="step-card"><div class="step-card-top"><button class="step-select" data-action="replace-step" data-id="${step.id}" title="从本平台事件中替换">${icon(snapshot.kind==='message'?'message':'event')}<h3 class="truncate">${esc(snapshot.name)}</h3>${icon('chevron')}</button><span class="grow"></span>${iconButton('step-up','up','步骤上移',`data-id="${step.id}" ${i===0?'disabled':''}`)}${iconButton('step-down','down','步骤下移',`data-id="${step.id}" ${i===S.draft.steps.length-1?'disabled':''}`)}${iconButton('remove-step','x','移除此步骤',`data-id="${step.id}"`)}</div><div class="step-meta"><span>${esc(schemaFor(snapshot).name)}</span><span>·</span><span>已保存版本 v${snapshot.revision}</span>${outdated?`<button class="text-btn" data-action="sync-step" data-id="${step.id}" style="font-size:10px">有新版本 v${current.revision} · 同步</button>`:''}</div><div class="step-preview">${esc(payloadPreview(snapshot)).replace(/\n/g,'<br>')}</div><div class="step-controls"><span class="tiny-label">发送前等待</span><input class="wait-input" type="number" min="0" max="60" step="0.1" value="${step.wait}" data-step-wait="${step.id}" aria-label="步骤 ${i+1} 发送前等待秒数"><span class="tiny-label">秒</span><span class="pill">期望 ${snapshot.expected.status}</span><span class="grow"></span><button class="text-btn" data-action="step-source" data-id="${step.eventId}">编辑来源</button>${button('发送此步','run-step','play','small quiet',`data-id="${step.id}" ${activeRun()?'disabled':''}`)}</div></div></div>`;}
  function scenarioEditor(){const scenario=S.draft;const run=displayRunFor(scenario.id);return`${entityHeader()}<div class="editor-tabs"><span class="tab active">步骤编排 <span class="count-inline">${scenario.steps.length}</span></span><span class="grow"></span><span class="muted" style="font-size:10px">按顺序执行</span></div><div class="editor-scroll">${run?renderRunSummary(run):''}<div class="builder-intro">${logo(scenario.platform)}<div class="grow"><h3>${esc(platform(scenario.platform).name)}剧本 <span class="pill" style="margin-left:6px">${scenario.steps.length?'平台已锁定':'等待添加首步'}</span></h3><p>只能选择${esc(platform(scenario.platform).name)}下的已保存事件。每个步骤保留选入时的版本。</p></div>${scenario.steps.length?'':button('选择平台','scenario-platform','','small')}</div><div class="step-list">${scenario.steps.map(stepCard).join('')}</div><button class="add-step" data-action="add-step">${icon('plus')}添加已保存事件</button><div class="builder-bottom"><span>步骤失败时</span><select data-edit="scenario-failure" aria-label="剧本步骤失败处理"><option value="stop" ${scenario.failure==='stop'?'selected':''}>停止当前剧本</option><option value="continue" ${scenario.failure==='continue'?'selected':''}>继续下一步</option></select><span class="grow"></span><span>${scenario.steps.length} 步 · 总等待 ${scenario.steps.reduce((sum,step)=>sum+step.wait,0).toFixed(1)} 秒</span></div>${run?`<div style="margin-top:25px">${renderRunLanes(run)}</div>`:''}</div><footer class="receipt-bar">${icon('link')}<span class="muted">从已保存事件组装，编辑来源后可主动同步版本</span><span class="grow"></span>${scenario.revision?button('加入执行编排','add-to-plan','plan','quiet small'):''}</footer>`;}
  function planLanes(){const plan=S.draft;return`<div class="run-lanes">${plan.items.map((item,i)=>{const scene=item.snapshot,current=db.scenarios.find(s=>s.id===item.scenarioId),outdated=current&&current.revision>scene.revision;return`${plan.mode==='serial'&&i>0?`<div class="serial-join">${icon('down')}上一剧本结束后开始</div>`:''}<article class="lane"><header class="lane-head"><span class="lane-number">${String(i+1).padStart(2,'0')}</span>${logo(scene.platform)}<div class="grow"><h3>${esc(scene.name)}</h3><p>${esc(platform(scene.platform).name)} · ${scene.steps.length} 步 · v${scene.revision}${outdated?` <button class="text-btn" style="font-size:10px" data-action="sync-lane" data-id="${item.id}">有新版本 · 同步</button>`:''}</p></div>${iconButton('lane-up','up','剧本上移',`data-id="${item.id}" ${i===0?'disabled':''}`)}${iconButton('lane-down','down','剧本下移',`data-id="${item.id}" ${i===plan.items.length-1?'disabled':''}`)}${iconButton('remove-lane','x','从编排中移除剧本',`data-id="${item.id}"`)}</header><div class="lane-track">${scene.steps.map((step,j)=>`${j?'<span class="track-arrow">→</span>':''}<div class="lane-node">${esc(step.snapshot.name)}<small>${String(j+1).padStart(2,'0')} · ${step.wait?`等待 ${step.wait}s`:'立即发送'}</small></div>`).join('')||'<span class="muted">这个剧本还没有步骤</span>'}</div></article>`;}).join('')}</div>`;}
  function planEditor(){const plan=S.draft,run=displayRunFor(plan.id);return`${entityHeader()}<div class="editor-tabs"><span class="tab active">执行计划 <span class="count-inline">${plan.items.length}</span></span><span class="grow"></span><span class="muted" style="font-size:10px">每个剧本内部仍按顺序执行</span></div><div class="editor-scroll">${run?renderRunSummary(run):''}<div class="mode-switch" aria-label="执行模式"><button class="mode-option ${plan.mode==='parallel'?'active':''}" data-action="plan-mode" data-mode="parallel" aria-pressed="${plan.mode==='parallel'}">${icon('parallel')}并行执行</button><button class="mode-option ${plan.mode==='serial'?'active':''}" data-action="plan-mode" data-mode="serial" aria-pressed="${plan.mode==='serial'}">${icon('serial')}串行执行</button></div><p class="mode-copy">${plan.mode==='parallel'?'所有剧本同时开始，分别执行各自的事件序列。':'按下方排列顺序，等待一个剧本结束，再开始下一个。'}</p>${plan.mode==='parallel'&&plan.items.length?'<div class="parallel-marker">T + 0 <span style="font-family:var(--body)">同时起跑</span></div>':''}${planLanes()}<button class="add-lane" data-action="add-lane">${icon('plus')}添加已保存剧本</button><div class="builder-bottom" style="margin-left:0"><span>剧本失败时</span><select data-edit="plan-failure" aria-label="编排失败处理"><option value="continue" ${plan.failure==='continue'?'selected':''}>继续其他剧本</option><option value="stop" ${plan.failure==='stop'?'selected':''}>停止整个编排</option></select><span class="grow"></span><span>${new Set(plan.items.map(i=>i.snapshot.platform)).size} 个平台 · ${plan.items.reduce((sum,item)=>sum+item.snapshot.steps.length,0)} 个事件</span></div>${run?`<section style="margin-top:26px"><h3 class="section-title">本次运行 · ${run.mode==='parallel'?'并行':'串行'}快照</h3>${renderRunLanes(run)}</section>`:''}</div><footer class="receipt-bar">${icon('info')}<span class="muted">运行使用启动时的快照，后续编辑不影响正在执行的任务</span></footer>`;}
  function connectionEditor(){const c=S.draft,p=platform(c.platform);return`${entityHeader()}<div class="editor-tabs"><span class="tab active">目标服务</span><span class="grow"></span><span class="pill">本地开发</span></div><div class="editor-scroll"><div class="info-line">${icon('info')}<span>填写你的服务接收回调的地址。原型只保存配置并模拟回执，所有凭据均为演示占位。</span></div><div class="settings-grid"><div class="settings-field full-width"><label for="connection-url">回调目标地址</label><input id="connection-url" data-connection="url" value="${esc(c.url)}" spellcheck="false"><small>该平台的事件和剧本共享这个地址，其他平台单独设置。</small></div>${(c.platform==='douyin'?[['clientKey','Client Key','应用标识'],['clientSecret','Client Secret','用于构造平台签名的演示配置']]:c.platform==='wecom'?[['corpId','CorpID','企业标识'],['token','Token','回调签名 Token'],['aesKey','EncodingAESKey','消息加密密钥的演示占位']]:[]).map(([key,label,note])=>`<div class="settings-field ${key==='aesKey'?'full-width':''}"><label for="connection-${key}">${label}</label><input id="connection-${key}" type="${['clientSecret','token','aesKey'].includes(key)?'password':'text'}" data-connection="${key}" value="${esc(c[key])}" autocomplete="off"><small>${note}</small></div>`).join('')}</div><div class="connection-line">${icon('info')}<span>${p.ready?(p.id==='douyin'?'抖音 dop · JSON 回调':'企业微信自建应用 · XML 回调'):'容量演示平台，尚未定义协议'}</span></div><div style="margin-top:35px;border-top:1px solid var(--line);padding-top:22px"><h3 class="section-title">原型素材</h3><p class="muted" style="font-size:11px;line-height:1.9;margin-bottom:17px">导出事件、剧本、编排及字段说明，方便在另一个浏览器继续体验。</p><div class="row">${button('导出素材','export','download')}${button('导入素材','import','upload')}${hasImportBackup()?button('恢复导入前素材','restore-import','history','quiet'):''}${button(db.scale?'退出容量演示':'开启容量演示','scale','grid','quiet')}</div></div></div>`;}
  function historyContent(){const run=S.draft;if(!run)return`<div class="empty" style="margin:auto">${icon('history')}<h3>运行之后，回到这里看结果</h3><p>每次运行都保留当时的参数快照、执行顺序和模拟回执。</p>${button('去调试一条事件','nav','event','soft','data-view="events"')}</div>`;return`<header class="entity-head"><div class="entity-kicker">${icon('history')}<span>模拟运行记录</span><span class="grow"></span>${statusBadge(run.status)}</div><h1 style="font-size:23px;font-weight:620">${esc(run.name)}</h1><p class="muted" style="font-size:10px;margin-top:10px">${dateLabel(run.started)} · ${run.id}</p></header><div class="editor-scroll">${renderRunSummary(run)}${run.cancelledByReload?'<div class="info-line">页面关闭前仍在执行，此次模拟已停止。</div>':''}${renderRunLanes(run)}<div style="margin-top:24px"><h3 class="section-title">事件与回执</h3>${run.lanes.flatMap(lane=>lane.steps.map(step=>({lane,step}))).map(({lane,step},i)=>`<div class="history-row">${logo(lane.platform,true)}<div class="grow"><h3>${esc(step.snapshot.name)}</h3><p>${esc(lane.name)} · ${step.receipt?`HTTP ${step.receipt.status||'超时'} · ${step.receipt.elapsed} ms`:'尚未发送'}</p></div>${statusBadge(step.status)}${step.receipt?button('查看快照','history-receipt','','small quiet',`data-index="${i}"`):''}</div>`).join('')}</div></div>`;}
  function renderContent(){return`<section class="main-content" aria-label="${VIEW[S.view].name}编辑区">${!S.draft&&S.view!=='history'?`<div class="empty">${icon(VIEW[S.view].icon)}<h3>选择一个${VIEW[S.view].singular}开始</h3>${button('新建','new','plus','soft')}</div>`:S.view==='events'?eventEditor():S.view==='scenarios'?scenarioEditor():S.view==='plans'?planEditor():S.view==='connections'?connectionEditor():historyContent()}</section>`;}
  function themeChoice(id, theme, expanded=false){const selected=S.theme===id;return `<button type="button" class="theme-choice ${selected?'selected':''} ${expanded?'expanded':''}" data-action="theme" data-theme="${id}" aria-pressed="${selected}" title="${esc(theme.name+' · '+theme.description)}"><span class="theme-mini" aria-hidden="true" style="--sample-surface:${theme.colors.surface};--sample-sidebar:${theme.colors.sidebar};--sample-primary:${theme.colors.primary};--sample-border:${theme.colors.border}"><i></i><b></b><em></em></span><span class="theme-choice-copy"><strong>${theme.name}</strong><small>${theme.tag}</small></span>${selected?icon('check','theme-check'):''}</button>`;}
  function renderControls(){return `<aside class="theme-shelf" aria-label="参数工作台配色选择"><div class="theme-shelf-inner"><div class="theme-shelf-label"><strong>参数工作台</strong><span>配色预览 <span class="theme-arrow-hint">← →</span></span></div>${iconButton('theme-prev','left','上一套配色')}<div class="theme-options" role="group" aria-label="七套配色">${Object.entries(THEMES).map(([id,theme])=>themeChoice(id,theme)).join('')}</div>${iconButton('theme-next','right','下一套配色')}<span class="theme-divider"></span><button class="theme-inspect" data-action="theme-info" title="查看配色说明与色板">${icon('grid')}<span>色板</span></button>${iconButton('state','code','查看原型状态')}</div></aside>`;}
  function render(preserveScroll=true){const scroll=preserveScroll?document.querySelector('.editor-scroll')?.scrollTop||0:0,libScroll=preserveScroll?document.querySelector('.library-list')?.scrollTop||0:0;document.getElementById('app').innerHTML=renderWorkbench();document.getElementById('prototype-controls').innerHTML=renderControls();const editor=document.querySelector('.editor-scroll');if(editor)editor.scrollTop=scroll;const list=document.querySelector('.library-list');if(list)list.scrollTop=libScroll;document.title=`MockPulse · 参数工作台 · ${VIEW[S.view].name} · ${THEMES[S.theme].name}`;}
  function applyTheme(id){document.documentElement.dataset.theme=id;document.documentElement.dataset.mode=THEMES[id].mode;document.title=`MockPulse · 参数工作台 · ${VIEW[S.view].name} · ${THEMES[id].name}`;}
  function changeTheme(id){if(!THEMES[id])return;const focused=document.activeElement;const focusWasTheme=focused?.matches?.('[data-action="theme"]');S.theme=id;applyTheme(id);try{localStorage.setItem(THEME_STORAGE_KEY,id);}catch{}try{const url=new URL(location.href);url.searchParams.delete('variant');url.searchParams.delete('detail');url.searchParams.set('theme',id);url.searchParams.set('view',S.view);if(S.draft?.id&&itemById(S.view,S.draft.id))url.searchParams.set('id',S.draft.id);else url.searchParams.delete('id');if(db.scale)url.searchParams.set('scale','1');else url.searchParams.delete('scale');history.replaceState(null,'',url);}catch{}document.getElementById('prototype-controls').innerHTML=renderControls();if(S.modalType==='theme-info')renderThemePanel();const scope=S.modalType==='theme-info'?document.getElementById('modal'):document.getElementById('prototype-controls');const current=scope.querySelector(`[data-action="theme"][data-theme="${id}"]`);if(focusWasTheme)current?.focus({preventScroll:true});const stripChoice=document.querySelector(`.theme-options [data-theme="${id}"]`);stripChoice?.scrollIntoView?.({block:'nearest',inline:'nearest',behavior:'auto'});console.info('[MockPulse prototype] Theme state',{layout:'参数工作台',theme:id,name:THEMES[id].name,view:S.view,dirty:S.dirty,selection:S.selected});}
  function cycleTheme(delta){const keys=Object.keys(THEMES),index=keys.indexOf(S.theme);changeTheme(keys[(index+delta+keys.length)%keys.length]);}
  function renderThemePanel(){const theme=THEMES[S.theme];modalFrame('给参数工作台选一套配色','七套配色共用同一布局和数据，可以直接切换比较。',`<div class="theme-panel-choices">${Object.entries(THEMES).map(([id,item])=>themeChoice(id,item,true)).join('')}</div><div class="theme-description"><div class="row"><h3>${theme.name}</h3><span class="pill">${theme.mode==='dark'?'深色':'浅色'}</span>${theme.recommended?'<span class="pill blue-pill">推荐</span>':''}</div><p>${theme.description}</p><div class="theme-source">${theme.source}</div></div><div class="theme-palette">${[['primary','主色'],['surface','工作区'],['sidebar','侧栏'],['text','正文'],['muted','次要文字'],['border','边线']].map(([key,label])=>`<div class="theme-token"><span class="theme-token-swatch" style="background:${theme.colors[key]}"></span><span>${label}</span><code>${esc(theme.colors[key])}</code></div>`).join('')}</div><p class="theme-footnote">配色选择会在本浏览器记住。切换时保留未保存的参数、筛选条件和滚动位置。</p>`,button('继续体验','close-modal','check','primary'),true);}

  function openModal(type,data={}){S.modalType=type;S.modalData=data;S.modalQuery='';S.modalPage=1;renderModal();const modal=document.getElementById('modal');if(!modal.open)modal.showModal();const autofocus=modal.querySelector('[autofocus]');if(autofocus)autofocus.focus();}
  function closeModal(){const modal=document.getElementById('modal');modal.close();S.modalType=null;S.modalData=null;}
  function selectOptions(selected){return activePlatforms().map(p=>`<option value="${p.id}" ${selected===p.id?'selected':''}>${esc(p.name)}${p.ready?'':' · 布局样本'}</option>`).join('');}

  function pickerItems(){const type=S.modalType,data=S.modalData;let entries=[];if(type==='platform'){entries=activePlatforms().map(p=>({...p,name:p.name,platform:p.id}));if(data.purpose==='filter')entries.unshift({id:'all',name:'全部平台',note:`${activePlatforms().length} 个平台`});}

  function openDictionary(path){const fields=eventFields(S.draft).map(({value,unknown,...meta})=>meta);openModal('dictionary',{definition:{schemaId:S.draft.schema,version:schemaFor(S.draft).version,fields},path:path||fields[0]?.path});}

  function createDraft(){const data=S.modalData,name=document.getElementById('new-name').value.trim();if(!name){document.getElementById('modal-error').textContent='请填写名称。';return;}const view=data.view,platformId=document.getElementById('new-platform')?.value||'douyin';let draft;if(view==='events'){const schemaId=document.getElementById('new-schema').value;draft={id:uid('event'),name,platform:platformId,schema:schemaId,kind:SCHEMAS[schemaId].kind,payload:clone(SCHEMAS[schemaId].payload),expected:{status:200,body:platformId==='wecom'?'success':''},simulate:'ok',revision:0,favorite:false,updated:stamp(),sample:!platform(platformId).ready};}else if(view==='scenarios'){draft={id:uid('scenario'),name,platform:platformId,steps:[],failure:'stop',revision:0,favorite:false,updated:stamp(),sample:!platform(platformId).ready};}else draft={id:uid('plan'),name,mode:document.getElementById('new-mode').value,items:[],failure:'continue',revision:0,favorite:false,updated:stamp()};closeModal();S.view=view;S.draft=draft;S.selected[view]=draft.id;S.dirty=true;S.tab='form';S.fieldErrors={};S.fieldInputs={};S.rawDirty=false;S.rawError='';S.fieldQuery='';render(false);}

  function renderRunSummary(run){const steps=run.lanes.flatMap(lane=>lane.steps),finished=steps.filter(step=>!['queued','running'].includes(step.status)).length,passed=steps.filter(step=>step.status==='success').length,failed=steps.filter(step=>step.status==='failed').length;return`<div class="run-summary"><div class="row"><h3 class="grow">${run.status==='running'?'正在模拟执行':'最近一次模拟运行'}</h3>${statusBadge(run.status)}${run.status==='running'?button('停止','stop-run','stop','small quiet'):button('查看记录','open-run','history','small quiet',`data-id="${run.id}"`)}</div><div class="run-stats"><span>${run.mode==='parallel'?'并行':'串行'} · ${run.lanes.length} 个${run.kind==='events'?'事件':'剧本'}</span><span class="mono">${finished} / ${steps.length}</span><span class="green">${passed} 通过</span>${failed?`<span class="red">${failed} 未通过</span>`:''}<span class="grow"></span><span>模拟回执</span></div><div class="progress-track"><div class="progress-fill" style="width:${steps.length?100*finished/steps.length:0}%"></div></div></div>`;}
  function renderRunLanes(run){return `<div class="run-lanes">${run.lanes.map((lane,i)=>`${run.mode==='serial'&&i?`<div class="serial-join">${icon('down')}等待前一剧本结束</div>`:''}<article class="lane"><header class="lane-head">${logo(lane.platform,true)}<div class="grow"><h3>${esc(lane.name)}</h3><p>${lane.startedAt==null?'尚未开始':`T + ${(lane.startedAt/1000).toFixed(2)}s 开始`}${lane.endedAt==null?'':` · ${(lane.endedAt/1000).toFixed(2)}s 结束`}</p></div>${statusBadge(lane.status)}</header><div class="lane-track">${lane.steps.map((step,j)=>`${j?'<span class="track-arrow">→</span>':''}<div class="lane-node ${step.status==='success'?'done':step.status==='running'?'active':step.status}">${esc(step.snapshot.name)}<small>${step.status==='queued'?`等待 · ${step.wait}s`:step.status==='running'?step.phase==='waiting'?`等待 ${step.wait}s`:'模拟发送中':step.status==='success'?`HTTP ${step.receipt?.status} · 通过`:step.status==='failed'?(step.receipt?.status?`HTTP ${step.receipt.status} · 未通过`:'超时 · 未通过'):step.status==='skipped'?'已跳过':'已停止'}</small></div>`).join('')}</div></article>`).join('')}</div>`;}
  function waitFor(ms,signal){return new Promise(resolve=>{if(signal.aborted){resolve(false);return;}const finish=value=>{clearTimeout(timer);signal.removeEventListener('abort',onAbort);resolve(value);};const onAbort=()=>finish(false);const timer=setTimeout(()=>finish(true),ms);signal.addEventListener('abort',onAbort,{once:true});});}
  function refreshRun(run){const active=document.activeElement;const focusKey=active&&['INPUT','TEXTAREA','SELECT'].includes(active.tagName)&&!document.getElementById('modal').contains(active)?['field','edit','input','connection','stepWait'].find(key=>Object.hasOwn(active.dataset,key)):null;const focusValue=focusKey?active.dataset[focusKey]:null;const start=focusKey?active.selectionStart:null,end=focusKey?active.selectionEnd:null;if(S.view==='history'&&S.selected.history===run.id)S.draft=clone(run);render();if(focusKey){const attribute='data-'+focusKey.replace(/[A-Z]/g,c=>'-'+c.toLowerCase());const restored=[...document.querySelectorAll(`[${attribute}]`)].find(node=>node.dataset[focusKey]===focusValue);restored?.focus({preventScroll:true});if(restored&&start!==null&&typeof restored.setSelectionRange==='function')try{restored.setSelectionRange(start,end);}catch{}}}
  async function startRun(kind,snapshot,originId=snapshot.id){
